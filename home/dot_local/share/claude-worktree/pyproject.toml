[project]
name = "claude-worktree"
version = "0.1.0"
description = "The Claude session-worktree pruner, and the library that judges one worktree: landed ladder, holds, classify, remove."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Not built or installed: callers reach it by path at its deployed location, the same
# way claude-guard, jsonq and tq are laid out. `package = false` keeps `uv run` from
# trying to build it.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# Unlike claude-guard, these modules can run under the SYSTEM interpreter:
# hooks/lib/run-python.sh falls back to `python3` on a host with no managed 3.15, and a
# timer runs prune-worktrees.py by its `#!/usr/bin/env python3`. The floor is 3.10.
