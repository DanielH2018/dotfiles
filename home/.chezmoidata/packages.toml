[[apps.base]]
name = "WireGuard"
# Windows gets WireGuard's own GUI client; Linux has no equivalent and never will — upstream ships
# a GUI for Windows/macOS/mobile only. On Linux the GUI is NetworkManager's, so there is no second
# package to install here: NM has handled wireguard as a native device type since 1.16, and the
# desktop's NM front-end draws the UI. Verified 2026-07-31 on Fedora 44: plasma-nm (part of the
# KDE spin) carries the full WireGuard editor, and the applet toggles tunnels. Checked and
# rejected as routes: nothing named wireguard in the Fedora repos beyond wireguard-tools, nothing
# on Flathub, no desktop-GUI COPR (only server/Android projects). The one standalone is Wireguird
# (GTK, unpackaged for Fedora) — strictly worse here than the native KDE editor.
winget = "WireGuard.WireGuard"
dnf = "wireguard-tools"
apt = "wireguard-tools"
manual = "The Linux GUI is NetworkManager's, not WireGuard's own: on KDE it is System Settings -> Network -> Connections -> + -> WireGuard (plasma-nm, installed with the KDE spin). Import an existing tunnel with `sudo nmcli connection import type wireguard file /etc/wireguard/wg0.conf` — no GUI front-end can import a .conf, only create one by hand, so import stays a one-line CLI step. Put `DNS =` in the .conf before importing; the import drops DNS otherwise and the tunnel resolves nothing. On a non-KDE desktop install nm-connection-editor for the same editor."

[[apps.base]]
name = "Mullvad VPN"
winget = "MullvadVPN.MullvadVPN"   # installed outside winget on the Windows box; id is valid
repo = "mullvad"
dnf = "mullvad-vpn"
apt = "mullvad-vpn"

[[apps.base]]
name = "Google Drive"
winget = "Google.GoogleDrive"
manual = "Google publishes no Linux client. Use rclone (`rclone config` -> drive) or KDE's kio-gdrive for Dolphin integration."

[[apps.base]]
name = "OneDrive"
# Linux-only entry on purpose: OneDrive ships with Windows 11, so adding a winget id here would
# start installing it on the Windows box for no gain. Microsoft publishes no Linux client at all,
# so every option below is third-party.
#
# onedriver (jstaf) over the alternatives, chosen for Dolphin: it is a FUSE filesystem that pulls
# files on demand, so Dolphin sees an ordinary mounted folder — thumbnails, previews and non-KDE
# apps all work — instead of a synced copy of the whole drive. Compared against, 2026-07-31:
#   - onedrive (abraunegg), the one package in Fedora proper: more mature and in-repo, but a full
#     local sync with no Dolphin story beyond "it is a folder".
#   - kio-onedrive (bernardogn), a native KIO worker giving onedrive:/ — the closest analogue to
#     kio-gdrive, but its author calls it basic-usage: no thumbnails or previews, and KIO-only so
#     nothing outside KDE can see it.
#   - rclone / Insync: rclone needs the Dolphin side assembled by hand; Insync is proprietary and
#     paid per account.
# This is a COPR rather than a distro package, which cuts against the dnf-first rule at the top of
# this file — Ghostty above sets the same precedent. jstaf's COPR builds for f44; Debian/Ubuntu
# need his OpenSUSE Build Service repo, which has no column here, hence the empty apt field.
# Mounting needs an escaped systemd *user* unit, so the setup step lives in LINUX-SETUP.md.
copr = "jstaf/onedriver"
dnf = "onedriver"

[[apps.base]]
name = "OBS Studio"
winget = "OBSProject.OBSStudio"
dnf = "obs-studio"
apt = "obs-studio"

[[apps.base]]
name = "VLC"
winget = "VideoLAN.VLC"
dnf = "vlc"
