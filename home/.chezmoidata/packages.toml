# Curated application list for full-machine provisioning — the single source of truth shared by
# the Windows and Linux app installers, in the same spirit as tools.toml for the CLI toolchain.
# One entry per application; each installer reads the field(s) for its own platform and ignores
# the rest:
#   winget   = winget package id        -> os-windows/run_onchange_after_install-apps.ps1.tmpl
#   dnf      = Fedora package name      -> os-linux/run_onchange_after_install-apps.sh.tmpl
#   apt      = Debian/Ubuntu package    -> same
#   flatpak  = Flathub application id   -> same; the fallback when dnf/apt can't supply it
#   copr     = Fedora COPR to enable first (dnf only)
#   repo     = third-party repo key the Linux installer knows how to add (see its REPO section)
#   tarball  = owner/repo of an upstream release that ships a directory rather than one binary
#   manual   = why there is NO automated route on the other platform; rendered into
#              LINUX-SETUP.md so an unavailable app is documented rather than silently dropped
#
# Resolution order on Linux is dnf/apt first, Flathub second: distro packages get better Wayland
# and theme integration and avoid a second runtime stack. Flathub is only used where the distro
# genuinely doesn't carry the app.
#
# Scope rules:
#   - The dev CLI toolchain (starship, zoxide, fzf, eza, fd, ripgrep, bat, fastfetch, fnm, uv,
#     neovim, yazi, zig, wezterm) belongs to tools.toml + the cli-tools installers. Not here.
#   - Games themselves are NOT listed — only launchers; libraries re-download after sign-in.
#   - An entry with no winget field is Linux-only; one with no Linux field is Windows-only.
#   - Some apps winget genuinely cannot provide (Office licence, GPU/chipset drivers, Ryzen
#     Master, Samsung Magician, NVIDIA App, Elgato Game Capture, Pokemon TCG Live, Xbox
#     Accessories msstore). They are listed here with a `manual` note and NO winget field, so the
#     absence is recorded rather than rediscovered; the Windows steps stay in WINDOWS-SETUP.md.
#
# winget ids verified 2026-07-19 against `winget export` on daniel-pc.
# Linux routes verified 2026-07-31 against Fedora 44 repos, Flathub's API, and each vendor's
# published repository.

# ---------------------------------------------------------------------------------------------
# GUI apps + utilities.
# ---------------------------------------------------------------------------------------------

