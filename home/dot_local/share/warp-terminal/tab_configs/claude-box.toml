name = "Claude · daniel-box"
title = "claude-box"
color = "yellow"

# Bare `ssh`, no remote command — this reproduces the path that demonstrably gets Warp's
# agent toolbar, which is a hand-typed ssh followed by a hand-typed `claude`.
#
# Handing ssh a remote command (`ssh -t host 'cd dir && claude'`) runs the far-side shell
# non-interactively, so it never sources the rc file Warp injects to bootstrap the remote
# session. Without that bootstrap no block wraps `claude`, and Warp identifies a CLI agent
# from the block's command — so the row got no toolbar, no branch and no agent icon.
#
# Three other shapes were tried and all lose the bootstrap, so don't reintroduce one:
#   ssh -t host 'cd dir && claude; exec zsh -l'          the original
#   ssh -t host 'cd dir && exec zsh -l'                  ends in an INTERACTIVE login shell
#   ssh -o RequestTTY=yes -o RemoteCommand='...' host    command moved into an ssh option
# The second is the informative one: the far-side shell is interactive and still gets no
# bootstrap, so this is not about interactivity — Warp declines whenever ssh carries a remote
# command at all, however it is supplied.
#
# Splitting it across two entries does not work either: Warp waits for the LOCAL shell prompt
# before sending the next command, and ssh never returns one. Verified — a second entry
# writing a marker file on daniel-box never ran.
#
# The tell that the bootstrap ran: the pane footer shows Warp's own `ubuntu@daniel-box` and
# cwd chips, and the sidebar row reads `daniel-box:~` rather than a bare `daniel-box`.
#
# So Claude is not started here. Run it yourself once the session is up, which is the same
# keystroke sequence that already works.
[[panes]]
id = "main"
type = "terminal"
directory = "~"
is_focused = true
commands = ["ssh daniel-box"]
