# OpenTelemetry Collector config for Claude Code telemetry.
#   metrics -> exposed for Prometheus to scrape (:8889/metrics)
#   logs    -> forwarded to Loki's native OTLP endpoint
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  # Metrics: collector exposes a /metrics endpoint Prometheus scrapes.
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep exposing each counter's last value long after activity stops. The default
    # (5m) drops idle metrics, making cumulative-counter panels flicker to "No data"
    # between bursts of usage.
    metric_expiration: 168h
    # Turn OTLP resource attributes (model, terminal, etc.) into metric labels
    # so you can break token usage down by model in Grafana.
    resource_to_telemetry_conversion:
      enabled: true

  # Event logs (tool decisions, api_request/error/refusal, mcp connections) ->
  # Loki's OTLP ingest path (Loki 3.x). otlp_http appends /v1/logs to the endpoint.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

  # Spans -> Tempo's own OTLP receiver. Plaintext: both ends are containers on this
  # host's private compose network, and nothing binds off 127.0.0.1.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: info
    # The collector's own metrics — queue depth, and the send_failed_* counters that
    # are the only evidence a batch was dropped on the way to Loki/Tempo/Prometheus.
    # Without these a silent export failure looks identical to "Claude Code was idle".
    # The default binds this endpoint to localhost, which inside the container means
    # nothing else can reach it; 0.0.0.0 lets Prometheus scrape it over the compose
    # network. The port stays unpublished, so it is not reachable from the host.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
