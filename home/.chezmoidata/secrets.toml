# Which paths count as secret — declared once.
#
# This set was previously re-declared in six dialects that share no source: a regex in
# block-dangerous-bash.sh, `case` arms in protect-secrets.sh, Read/Edit globs in the
# settings template, dotsync's ignore list, .gitignore, and the sandbox mount flags.
# Adding a secret meant six edits in six syntaxes, and ~/.claude/.credentials.json — the
# live OAuth token on Linux and WSL — was added to none of them.
#
# Lives in .chezmoidata so every chezmoi template can read it as `.secretPaths` with no
# build step; the same `chezmoi apply` that deploys a consumer renders it. This follows
# the existing tools.toml / packages.toml pattern in this directory.
#
# tests/secret-registry.test.js asserts each entry actually appears in every dialect it
# claims. Until the dialects are generated from here, that test is what keeps them in
# step — a new entry fails the suite until every consumer carries it.

[secretPaths]
version = 1

# --- credential stores -------------------------------------------------------

[[secretPaths.entries]]
id = "claude-oauth-credentials"
why = "live Claude Code OAuth access+refresh token; the Linux/WSL store, not ~/.claude.json"
value = "~/.claude/.credentials.json"
bash_re = '\.claude/\.credentials\.json'
case_arms = [".credentials.json", "*/.claude/.credentials.json"]
tool_globs = ["~/.claude/.credentials.json"]

[[secretPaths.entries]]
id = "claude-config"
why = "account block and historical OAuth store on some platforms"
value = "~/.claude.json"
bash_re = '\.claude\.json'
case_arms = [".claude.json", "*/.claude.json"]
tool_globs = ["~/.claude.json"]

[[secretPaths.entries]]
id = "git-credentials"
why = "plaintext git remote credentials"
value = "~/.git-credentials"
bash_re = '\.git-credentials'
case_arms = [".git-credentials", "*/.git-credentials"]
tool_globs = ["~/.git-credentials"]

[[secretPaths.entries]]
id = "aws-credentials"
why = "AWS access keys"
value = "~/.aws/credentials"
bash_re = '\.aws/credentials'
case_arms = [".aws/credentials", "*/.aws/credentials"]
tool_globs = ["**/.aws/credentials"]

[[secretPaths.entries]]
id = "kube-config"
why = "cluster certs and tokens"
value = "~/.kube/config"
bash_re = '\.kube/config'
case_arms = ["*/.kube/config"]
tool_globs = ["~/.kube/config"]

[[secretPaths.entries]]
id = "docker-config"
why = "registry auth tokens"
value = "~/.docker/config.json"
bash_re = '\.docker/config\.json'
case_arms = ["*/.docker/config.json"]
tool_globs = ["~/.docker/config.json"]

[[secretPaths.entries]]
id = "netrc"
why = "machine credentials for curl, ftp and friends"
value = "~/.netrc"
bash_re = '\.netrc'
case_arms = [".netrc", "*/.netrc"]
tool_globs = ["~/.netrc"]

# --- key material ------------------------------------------------------------

[[secretPaths.entries]]
id = "ssh-directory"
why = "private keys, known_hosts, and the agent config"
value = "~/.ssh/"
bash_re = '\.ssh/'
case_arms = ["*/.ssh/*"]
tool_globs = ["**/.ssh/**"]

[[secretPaths.entries]]
id = "gnupg-directory"
why = "GnuPG keyring"
value = "~/.gnupg/"
bash_re = '\.gnupg/'
case_arms = ["*/.gnupg/*"]
tool_globs = ["~/.gnupg/**"]

# --- system ------------------------------------------------------------------

[[secretPaths.entries]]
id = "etc-shadow"
why = "local password hashes"
value = "/etc/shadow"
bash_re = '/etc/shadow'
case_arms = ["/etc/shadow"]
tool_globs = ["/etc/shadow"]

[[secretPaths.entries]]
id = "etc-gshadow"
why = "group password hashes"
value = "/etc/gshadow"
bash_re = '/etc/gshadow'
case_arms = ["/etc/gshadow"]
tool_globs = ["/etc/gshadow"]

# Conformance corpus: every input must reach the named entry, whichever dialect asks.
[[secretPaths.cases]]
input = "/home/daniel/.claude/.credentials.json"
entry = "claude-oauth-credentials"

[[secretPaths.cases]]
input = ".credentials.json"
entry = "claude-oauth-credentials"

[[secretPaths.cases]]
input = "~/.claude/.credentials.json"
entry = "claude-oauth-credentials"
