# Core CLI toolchain shared across platforms — the single source of truth for the tools
# installed on more than one OS. Each installer consumes the field(s) for its own package
# manager and ignores the rest:
#   - winget = winget package id      -> run_onchange_install-cli-tools.ps1.tmpl  (Windows)
#   - brew   = Homebrew formula       -> Brewfile.tmpl                             (macOS)
#   - apt    = Debian/Ubuntu package  -> run_once_after_install-cli-tools.sh.tmpl  (Linux)
#   - dnf    = Fedora/RHEL package    -> run_once_after_install-cli-tools.sh.tmpl  (Linux)
#   - cmd    = binary name on PATH    -> used by the winget installer to skip-if-present
# An empty field means that installer doesn't handle this tool (it's absent there, or
# installed by another mechanism — e.g. eza/fastfetch come from GitHub release binaries on
# Linux, handled bespoke in the .sh script, so their apt/dnf fields are empty here).
#
# apt and dnf are deliberately kept in lockstep: a tool that comes from a GitHub release
# binary on Debian comes from one on Fedora too, even where Fedora happens to package it
# (eza, ripgrep, fzf, zoxide and fastfetch all exist in the Fedora repos). The same binaries
# on every Linux beats "whatever this distro shipped", and it keeps one code path under test.
# The dnf field therefore differs from apt only in package NAMING, never in coverage — except
# gron, which Fedora does not package at all (see below).
#
# OS-UNIQUE tools stay in their own installer, NOT here: winget's nvim/yazi/zig/wezterm/uv,
# and the Brewfile's casks / mas / vscode / brew-only (bash, chezmoi, gh, tmux, wget, ...).

[[tools]]
name = "bat"
cmd = "bat"
winget = "sharkdp.bat"
brew = "bat"
apt = "bat"
# Fedora ships the binary as /usr/bin/bat, not Debian's renamed `batcat`, so the real-name
# symlink step in the installer simply no-ops here.
dnf = "bat"

[[tools]]
name = "eza"
cmd = "eza"
winget = "eza-community.eza"
brew = "eza"
apt = ""
dnf = ""

[[tools]]
name = "fd"
cmd = "fd"
winget = "sharkdp.fd"
brew = "fd"
apt = "fd-find"
# Same package name as Debian, but Fedora installs /usr/bin/fd directly (no `fdfind`).
dnf = "fd-find"

[[tools]]
name = "fzf"
cmd = "fzf"
winget = "junegunn.fzf"
brew = "fzf"
apt = ""
dnf = ""

[[tools]]
name = "gron"
cmd = "gron"
# No winget package (checked microsoft/winget-pkgs — none exists); Windows goes without.
winget = ""
brew = "gron"
apt = "gron"
# Fedora packages no gron (checked F44). It is the one tool where apt and dnf coverage
# genuinely diverges, so the installer falls back to the tomnomnom/gron release binary
# whenever gron is still missing after the package step — a no-op on Debian, where apt
# supplied it.
dnf = ""

[[tools]]
name = "jq"
cmd = "jq"
winget = "jqlang.jq"
brew = "jq"
apt = "jq"
dnf = "jq"

[[tools]]
name = "ripgrep"
cmd = "rg"
winget = "BurntSushi.ripgrep.MSVC"
brew = "ripgrep"
apt = ""
dnf = ""

[[tools]]
name = "shellcheck"
cmd = "shellcheck"
winget = "koalaman.shellcheck"
brew = "shellcheck"
apt = "shellcheck"
# Fedora capitalises the package name (the binary stays lowercase `shellcheck`).
dnf = "ShellCheck"

[[tools]]
name = "starship"
cmd = "starship"
winget = "Starship.Starship"
brew = "starship"
apt = ""
dnf = ""

[[tools]]
name = "zoxide"
cmd = "zoxide"
winget = "ajeetdsouza.zoxide"
brew = "zoxide"
apt = ""
dnf = ""

[[tools]]
name = "fnm"
cmd = "fnm"
winget = "Schniz.fnm"
brew = "fnm"
apt = ""
dnf = ""

[[tools]]
name = "fastfetch"
cmd = "fastfetch"
winget = "Fastfetch-cli.Fastfetch"
brew = "fastfetch"
apt = ""
dnf = ""

[[tools]]
name = "lua"
cmd = "lua"
# Here for tests/terminal/wezterm-config.test.js, which syntax-checks the rendered WezTerm config
# with `luac -p`. Ubuntu's package installs /usr/bin/{lua5.4,luac5.4} and no bare names, so
# the installer symlinks both lua -> lua5.4 and luac -> luac5.4 into ~/.local/bin. No winget
# id: Windows gets Lua from the hardcoded DEVCOM.Lua entry in the ps1 installer instead,
# because that package hides luac.exe outside PATH and needs the bespoke skip handling.
winget = ""
brew = "lua"
apt = "lua5.4"
# Fedora's `lua` is 5.4 under unversioned names (/usr/bin/lua, /usr/bin/luac), so `luac -p`
# resolves without the symlink shim Debian needs.
dnf = "lua"

[[tools]]
name = "btop"
cmd = "btop"
winget = ""
brew = "btop"
apt = "btop"
dnf = "btop"

[[tools]]
name = "chafa"
cmd = "chafa"
winget = ""
brew = "chafa"
apt = "chafa"
dnf = "chafa"

[[tools]]
name = "curlie"
cmd = "curlie"
winget = ""
brew = "curlie"
apt = ""
dnf = ""

[[tools]]
name = "sd"
cmd = "sd"
winget = ""
brew = "sd"
apt = ""
dnf = ""

[[tools]]
name = "zsh"
cmd = "zsh"
winget = ""
# macOS ships zsh (the .zshrc targets the system /bin/zsh); brew's parallel zsh would
# only fork the login-shell path. Linux/WSL need it from apt. run_once_after_set-default-shell
# then chsh's to it.
brew = ""
apt = "zsh"
dnf = "zsh"

[[tools]]
name = "zsh-autosuggestions"
cmd = ""
winget = ""
brew = "zsh-autosuggestions"
apt = "zsh-autosuggestions"
# Fedora installs to the same /usr/share/zsh-autosuggestions/... path dot_zshrc.tmpl already
# probes, so no shell-config change is needed.
dnf = "zsh-autosuggestions"

[[tools]]
name = "zsh-syntax-highlighting"
cmd = ""
winget = ""
brew = "zsh-syntax-highlighting"
apt = "zsh-syntax-highlighting"
dnf = "zsh-syntax-highlighting"

[[tools]]
name = "inotify-tools"
cmd = "inotifywait"
# Backs agentview's picker-open watch loop (rows.sh: av_watch_once) on WSL and both servers.
# Linux-only kernel feature -- no winget/brew equivalent, so the watch falls back to a plain
# timer wherever this package is missing (see AV_WATCH_INTERVAL in rows.sh).
winget = ""
brew = ""
apt = "inotify-tools"
dnf = "inotify-tools"

[[tools]]
name = "script"
cmd = "script"
# Not a shell-experience tool -- it is what tests/chezmoi/chezmoi-scripts.test.js uses to hand the
# rendered set-default-shell script a pty, so the interactive chsh branch can be exercised.
# Debian and macOS both ship it in their base system, which is why apt and brew are empty and
# nobody noticed it was a dependency. Fedora splits it out of util-linux into its own package,
# so a stock Fedora box fails those tests until this lands. Windows has no equivalent and does
# not run that suite.
winget = ""
brew = ""
apt = ""
dnf = "util-linux-script"
