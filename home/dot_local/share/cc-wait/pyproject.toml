[project]
name = "cc-wait"
version = "0.1.0"
description = "One command for every wait a Claude Code session makes: a landing, CI, a rollout, a file."
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Not built or installed: the wrapper reaches it by PYTHONPATH at its deployed path, the same
# way claude-guard is laid out. `package = false` keeps `uv run` from trying to build it.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# The repo root's ruff config targets py39 for the tools that must run under a system
# interpreter. This package runs under uv's managed 3.14 only, so it gets its own target;
# ruff picks the closest pyproject.toml.
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
