[project]
name = "config-map"
version = "0.1.0"
description = "Deterministic generator for the Claude Setup Map — scans your Claude Code config surface and emits one self-contained HTML page"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
