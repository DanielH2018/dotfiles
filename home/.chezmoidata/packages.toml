# --- Hardware vendor tools. None of the three Windows apps is in winget (checked against the
#     microsoft/winget-pkgs manifests 2026-07-31: the Samsung, AMD and Nvidia publisher
#     directories carry no Magician, Ryzen Master or NVIDIA App), so each is a vendor download on
#     Windows and carries the Linux equivalent that does exist. ---------------------------------

[[apps.base]]
name = "Samsung Magician"
manual = "Not in winget — vendor download on Windows (see WINDOWS-SETUP.md). On Linux the same SSD health, SMART data and NVMe firmware work is covered by smartmontools + nvme-cli, both installed below."

[[apps.base]]
name = "smartmontools"
# Linux stand-in for Samsung Magician's drive health/SMART reporting (`smartctl -a /dev/…`).
dnf = "smartmontools"
apt = "smartmontools"

[[apps.base]]
name = "nvme-cli"
# Linux stand-in for Samsung Magician's NVMe-specific health and firmware commands.
dnf = "nvme-cli"
apt = "nvme-cli"

[[apps.base]]
name = "AMD Ryzen Master"
manual = "Not in winget — vendor download on Windows (see WINDOWS-SETUP.md). CoreCtrl (installed below) is the closest Linux equivalent for CPU/GPU tuning and fan curves; it needs the amd_pstate driver and a kernel parameter for full control."

[[apps.base]]
name = "CoreCtrl"
# Linux stand-in for Ryzen Master: per-profile CPU/GPU tuning and fan curves.
dnf = "corectrl"
apt = "corectrl"

[[apps.base]]
name = "NVIDIA App"
manual = "Not in winget — vendor download on Windows (see WINDOWS-SETUP.md). On Linux the driver ships nvidia-settings (installed below) for the same panel; the driver itself is hardware-specific and stays a manual step, exactly as on Windows."

[[apps.base]]
name = "nvidia-settings"
# Ships with the proprietary driver and is the Linux counterpart to the NVIDIA App's control
# panel. Installing the driver itself is deliberately NOT automated here.
dnf = "nvidia-settings"
apt = "nvidia-settings"

# --- Windows-only utilities. Deliberately excluded from the Linux set: each one either patches
#     Windows itself or duplicates something the Linux desktop already provides. -------------

[[apps.base]]
name = "HWiNFO"
winget = "REALiX.HWiNFO"
manual = "Windows-only. `lm_sensors` (+ `sensors-detect`) and KDE's System Monitor cover sensor readout on Linux."

[[apps.base]]
name = "WizTree"
winget = "AntibodySoftware.WizTree"
manual = "Windows-only (it reads the NTFS MFT directly). Use Filelight on KDE, or `ncdu` in the terminal."

[[apps.base]]
name = "AutoHotkey"
winget = "AutoHotkey.AutoHotkey"
manual = "Windows-only. `keyd` (system-wide remapping) or `xremap` are the closest Linux equivalents; KDE also has custom shortcuts built in."

[[apps.base]]
name = "PowerToys"
winget = "Microsoft.PowerToys"
manual = "Windows-only, and largely redundant on KDE: KRunner replaces Run, KWin scripts replace FancyZones, and Spectacle replaces Screen Ruler."

[[apps.base]]
name = "Sysinternals Autoruns"
winget = "Microsoft.Sysinternals.Autoruns"
manual = "Windows-only. `systemd-analyze blame`, `systemctl list-unit-files` and ~/.config/autostart are the Linux equivalents."

[[apps.base]]
name = "Winaero Tweaker"
winget = "winaero.tweaker"
manual = "Windows-only shell tweaker. KDE's System Settings covers the same ground natively."

[[apps.base]]
name = "ExplorerPatcher"
winget = "valinet.ExplorerPatcher"
manual = "Windows-only — it patches the Windows 11 shell. Nothing to port."

[[apps.base]]
name = "Winget-AutoUpdate"
winget = "Romanitho.Winget-AutoUpdate"
manual = "Windows-only updater. On Linux use `dnf-automatic` (Fedora) or `unattended-upgrades` (Debian/Ubuntu); flatpak updates come from the desktop's own updater."

# ---------------------------------------------------------------------------------------------
# Dev tooling not covered by the CLI-tools installers.
# ---------------------------------------------------------------------------------------------

[[apps.coding]]
name = "Git"
winget = "Git.Git"
dnf = "git"
apt = "git"

[[apps.coding]]
name = "GitHub CLI"
winget = "GitHub.cli"
manual = "Installed on Linux by os-linux/run_once_after_install-cli-tools.sh.tmpl, which also adds cli.github.com's apt repo so Ubuntu doesn't pin gh at 2.45. Deliberately not duplicated here."

[[apps.coding]]
name = "Visual Studio Code"
winget = "Microsoft.VisualStudioCode"
repo = "vscode"
dnf = "code"
apt = "code"

[[apps.coding]]
name = "Windows Terminal"
winget = "Microsoft.WindowsTerminal"
manual = "Windows-only by definition. Ghostty (below) is the Linux terminal; WezTerm is installed by the CLI-tools script for its headless mux-server."

[[apps.coding]]
name = "age"
winget = "FiloSottile.age"
dnf = "age"
apt = "age"

[[apps.coding]]
name = "Bitwarden CLI"
winget = "Bitwarden.CLI"   # `bw` — pulls the WireGuard config at provision time
# Bitwarden tags its CLI releases `cli-vYYYY.M.P`, so the releases/latest redirect that
# latest_tag() follows resolves the *desktop* release instead. Handled bespoke in the installer.
bw_cli = true

[[apps.coding]]
name = "scrcpy"
winget = "Genymobile.scrcpy"
# Genymobile develops scrcpy on Linux, so it is at least as useful here as on Windows. Debian and
# Ubuntu package it; Fedora does not (no rpms/scrcpy in dist-git, zero Bodhi updates as of
# 2026-07-31), so Fedora takes the upstream release tarball instead.
apt = "scrcpy"
tarball = "Genymobile/scrcpy"
tarball_bin = "scrcpy"
tarball_url = "https://github.com/Genymobile/scrcpy/releases/download/{tag}/scrcpy-linux-{arch}-{tag}.tar.gz"

[[apps.coding]]
name = "Ghostty"
# The terminal this config targets on macOS and Linux (dot_config/ghostty). Neither distro
# packages it: Fedora uses the COPR that ghostty.org's own install docs point at; Debian/Ubuntu
# use the .deb from mkasberg/ghostty-ubuntu, which the same docs recommend.
copr = "scottames/ghostty"
dnf = "ghostty"
ghostty_deb = true

# ---------------------------------------------------------------------------------------------
# Game launchers only (never individual games).
# ---------------------------------------------------------------------------------------------

[[apps.gaming]]
name = "Steam"
winget = "Valve.Steam"
# Fedora keeps Steam in RPM Fusion nonfree; Debian/Ubuntu have it in multiverse/non-free.
repo = "rpmfusion"
dnf = "steam"
apt = "steam-installer"
# Fallback when the package route can't be satisfied — RPM Fusion unreachable on Fedora, or
# multiverse/non-free not enabled on Debian/Ubuntu.
flatpak = "com.valvesoftware.Steam"

[[apps.gaming]]
name = "Discord"
winget = "Discord.Discord"
# RPM Fusion free carries Discord on Fedora; Debian/Ubuntu do not package it, so Flathub covers
# them via the fallback.
repo = "rpmfusion"
dnf = "discord"
flatpak = "com.discordapp.Discord"

[[apps.gaming]]
name = "Prism Launcher"
winget = "PrismLauncher.PrismLauncher"
flatpak = "org.prismlauncher.PrismLauncher"

[[apps.gaming]]
name = "Minecraft Launcher"
# The official Mojang launcher, alongside Prism rather than instead of it: Prism manages modded
# instances, the official launcher is what Realms and the Bedrock/vanilla path expect.
winget = "Mojang.MinecraftLauncher"
flatpak = "com.mojang.Minecraft"

[[apps.gaming]]
name = "Temurin JDK"
winget = "EclipseAdoptium.Temurin.25.JDK"   # Java runtime Prism needs for Minecraft
# Fedora and Debian both ship OpenJDK 25 builds; no need for Adoptium's own repo on Linux.
dnf = "java-25-openjdk"
apt = "openjdk-25-jre"

[[apps.gaming]]
name = "Epic Games Launcher"
winget = "EpicGames.EpicGamesLauncher"
# No native Linux client. Heroic is the maintained open-source launcher for Epic (and Amazon)
# libraries, running titles through Wine/Proton.
flatpak = "com.heroicgameslauncher.hgl"

[[apps.gaming]]
name = "EA Desktop"
winget = "ElectronicArts.EADesktop"   # verify: not winget-sourced on the Windows box
manual = "No Linux client. Heroic (installed above) can add the EA app as a third-party source under Wine/Proton; expect per-title breakage."

[[apps.gaming]]
name = "League of Legends"
winget = "RiotGames.LeagueOfLegends.NA"   # verify: Riot bootstrapper, region-specific
manual = "Not possible on Linux. Riot's Vanguard kernel-level anti-cheat has been required for League since 2024 and blocks Wine/Proton outright; there is no workaround."
