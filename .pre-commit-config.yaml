repos:
  # Secret scanning. Every other guard in this repo is PATH-shaped — .gitignore blocks
  # **/*.local.*, .chezmoiignore keeps work content out, and .chezmoidata/secrets.toml
  # declares which paths count as secret. All three catch a secret that arrives at a path
  # someone predicted in advance. None catches the case that actually recurs here: a value
  # pasted into an ordinary script, doc or test fixture, at a path nobody would list.
  #
  # This is not the only secret scanner on the repo, and the difference is WHEN. GitGuardian
  # is installed as a GitHub App and checks every commit on main and every PR — but it runs
  # after the commit exists on GitHub, so its verdict arrives once the value is already in
  # published history and the only remaining action is a rotation. This hook runs before the
  # commit, which is the one moment a secret is not yet a leak. It also works offline, and it
  # covers the direct push that never opens a PR.
  #
  # GitHub's own push protection would be the third layer and is NOT available: it is a
  # public-repo / GHAS feature and this repo is private.
  #
  # A remote repo hook rather than `language: system` like shellcheck and oxlint below,
  # for the opposite reason to theirs: those two need a host binary because their upstream
  # hooks are docker_image, which the rootless-podman shim here cannot serve. gitleaks'
  # hook is `language: golang`, which prek builds into its own cache — no docker, no host
  # install, nothing to add to tools.toml.
  #
  # That also settles a second problem. home/dot_local/bin/executable_claude-transcript-scan
  # resolves gitleaks from $GITLEAKS_BIN, then PATH, then ~/.cache/prek/hooks/golang-*/bin/
  # gitleaks. Until this hook existed only the third path ever hit, and the binary it found
  # belonged to a DIFFERENT repo's hook cache — a security control whose only dependency was
  # a cache another repo owns and prek is free to collect. This hook puts one in ours.
  #
  # Pinned to the rev the homelab repo runs, so the two agree on rules and version.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # `files:` is a WIDENER here, not an allowlist. It once was an allowlist, reaching
      # only 23 of the repo's 51 Python files, so config-map, vault-index, quality/ and a
      # hook went ungated; that is gone, and `\.py$` now admits every Python file in the
      # repo the way pre-commit resolving the list itself would.
      #
      # The named alternatives are GENERATED by bin/gen-lint-files from the shebang census
      # of the tree, and naming one is only HALF of what it takes. `files:` and `types_or:`
      # are ANDed, and `types_or: [python]` types a file by extension, or by shebang only if
      # the file is EXECUTABLE. An extensionless script therefore needs BOTH: a name here
      # AND a +x bit in git. That is easy to get wrong, because chezmoi's executable_ prefix
      # sets the DEPLOYED mode, so a 100644 source still deploys as 0755 and nothing looks
      # broken — executable_jsonq sat at 100644 and went unlinted for its whole existence.
      # The name half is now `bin/gen-lint-files` (its --check fails CI when this line is
      # stale); the mode half is `git update-index --chmod=+x`, which
      # tests/lint-gate-coverage.test.js asserts. The same census renders ruff.toml, so a
      # bare `ruff check .` outside prek sees the same scripts.
      - id: ruff-check
        types_or: [python]
        # gen-lint-files: ruff-check
        files: (\.py$|^(home/dot_local/bin/(executable_claude-rc-resume|executable_jsonq|executable_otel-sweep|executable_otelq|executable_planka|executable_prompt-friction|executable_stash-mine|executable_stdio-blocking|executable_streamdeck-usb-reset|executable_tq|executable_wl-bmp2png|executable_wpe-pick))$)

  - repo: local
    hooks:
      # Nothing ran shellcheck before this except the same edit hook. Settings live in
      # .shellcheckrc so this and the hook agree without either passing flags.
      #
      # `language: system` against the installed binary, NOT koalaman/shellcheck-precommit:
      # that hook is a docker_image, and docker here is the rootless-podman shim, which
      # re-pulls the image per batch and then cannot read the bind-mounted files
      # ("openBinaryFile: permission denied" — the :z / --userns=keep-id problem). The
      # system binary has none of that and is already a dependency of lint-after-edit.
      #
      # .chezmoitemplates/linux-install.sh is excluded because it is a Go template that
      # happens to end in .sh — shellcheck cannot parse `{{/* ... */}}` and reports a
      # syntax error on line 1 regardless of the shell below it.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: ^home/\.chezmoitemplates/

      # dot_bashrc and dot_zshenv are shell and were checked by nothing. An rc file is
      # sourced, never executed, so it carries no shebang and (correctly) no +x bit; with no
      # extension either, `types: [shell]` above cannot identify one and skipped both
      # silently -- verified with `prek run shellcheck --files home/dot_bashrc`, which
      # answers "(no files to check)".
      #
      # A second hook rather than a wider `files:` on the one above, because `files` and
      # `types` are ANDed: naming them there would ALSO require them to type as shell, and
      # for an extensionless file that means a +x bit, which is the one thing an rc file
      # must not have. Omitting `types` here defaults it to `[file]`, so the name alone
      # decides. Each file declares its own dialect with an in-file `# shellcheck shell=`
      # directive -- there is no shebang to infer it from.
      - id: shellcheck-rc
        name: shellcheck (rc files)
        entry: shellcheck
        language: system
        files: ^home/(dot_bashrc|dot_zshenv)$

      # The *.sh.tmpl scripts -- the run_once_/run_onchange_ ones chezmoi executes during
      # apply, which are also the ones that call sudo -- were outside every gate for the
      # same extension reason: `.sh.tmpl` is not `.sh`. They cannot be linted in place
      # (Go template syntax is a shell parse error, the same reason .chezmoitemplates/ is
      # excluded above), so bin/lint-sh-templates renders each one through chezmoi and
      # lints the result. See that file for why --source matters in a worktree.
      - id: shellcheck-templates
        name: shellcheck (rendered chezmoi templates)
        entry: bin/lint-sh-templates
        language: system
        files: \.sh\.tmpl$

      # JavaScript is the largest language here (153 .js + 26 .mjs) and nothing linted it.
      # oxlint rather than eslint because this repo has no package.json and no node_modules
      # on purpose -- the suite is plain `node --test` -- so the linter has to be a single
      # binary run as `language: system`, exactly like ruff and shellcheck above. Rules and
      # the reasoning behind the three that are off live in .oxlintrc.json, which oxlint
      # discovers from the repo root on its own.
      #
      # It runs through bin/lint-js rather than calling oxlint directly, for two reasons that
      # both make a bare `entry: oxlint` silently useless. oxlint selects files by EXTENSION
      # and refuses anything else ("No files found to lint"), which would exclude the five
      # extensionless `#!/usr/bin/env node` scripts -- among them bin/config-soak, itself a
      # push gate. And every rule in the default correctness category reports at WARNING
      # severity, where oxlint exits 0: without --deny-warnings the hook would print findings
      # and pass. See that script for how both are handled.
      #
      # `files:` is a WIDENER, the same way it is on ruff-check: it is ANDed with types_or,
      # so it admits those extensionless scripts, which `javascript` cannot type by
      # extension. They need the +x bit in git as well, since a shebang only types a file
      # that is executable -- four of the five sat at 100644 and were set executable in the
      # commit that added this hook. The list is generated by bin/gen-lint-files from the
      # tree's shebangs; a new extensionless node script still needs the +x bit, which
      # tests/lint-gate-coverage.test.js asserts.
      #
      # Deliberately NOT skip-if-absent, unlike bin/lint-sh-templates: chezmoi is already a
      # hard dependency of working in this repo, but oxlint is new and installed nowhere
      # until `chezmoi apply` runs post-install/run_onchange_after_install-js-lint.sh.tmpl.
      # A hook that quietly skips when its tool is missing would be a no-op on every machine
      # -- which is the failure this whole change exists to fix.
      - id: oxlint
        name: oxlint (javascript)
        entry: bin/lint-js
        language: system
        types_or: [javascript]
        # gen-lint-files: oxlint
        files: (\.(js|mjs)$|^(bin/(config-soak|gen-hooks|gen-lint-files|gen-skill-router)|home/dot_local/bin/(executable_claude-settings-merge|executable_dotsync|executable_terminal-cheatsheet|executable_tools-inventory))$)

      # One audit found four GNU-only shell idioms in a single session -- bare `sed -i`, `\b`
      # inside a bash [[ =~ ]] regex, and an mktemp template with a suffix after the X's. All
      # four passed every gate here, because all four are correct on the Linux hosts they were
      # written on and only misbehave on BSD/macOS userland. One was a live bypass in
      # block-dangerous-bash.sh. bin/lint-bsd-portability is the cheap textual check; its
      # header carries the three commits and what it deliberately does not catch.
      #
      # `files:` with no `types:`, following shellcheck-rc above. The set spans shell, .sh.tmpl
      # and .js, and `files` is ANDed with `types` -- a .sh.tmpl types as text, not shell, so
      # naming `types: [shell]` here would drop every template. The alternation therefore has
      # to name every extensionless script itself; bin/gen-lint-files renders that branch
      # from the tree's shebangs. tests/lint-bsd-portability.test.js asserts the pattern
      # still admits every file `bin/lint-bsd-portability --list` derives, so the generator's
      # census and the script's own cannot drift apart silently.
      #
      # Suppressions live in the script, not in an `exclude:` here, so that a manual run and a
      # commit-time run agree on what is checked.
      - id: bsd-portability
        name: BSD/macOS shell portability
        entry: bin/lint-bsd-portability
        language: system
        # gen-lint-files: bsd-portability
        files: (\.(sh|bash|zsh|js|mjs|cjs)$|\.(sh|bash)\.tmpl$|^(\.githooks/pre-push|bin/(check-eval-freshness|check-push-signatures|config-soak|gate-cache|gen-hooks|gen-lint-files|gen-skill-router|install-hook-shim|land|lint-bsd-portability|lint-js|lint-sh-templates|skill-usage|sweep-test-tmp|try)|home/\.chezmoitemplates/(is-desktop-linux|is-wsl|require-sudo)|home/(dot_bashrc|dot_zshenv)|home/dot_local/bin/(executable_audio-sink-toggle|executable_bt-hid-kick|executable_claude-changelog-watch|executable_claude-guard|executable_claude-settings-merge|executable_claude-transcript-scan|executable_clip-bridge|executable_clip2server|executable_ct|executable_cts|executable_ctw|executable_desk-away|executable_discord|executable_dotsync|executable_effort|executable_fix-games-mount|executable_flatpak-update|executable_jq|executable_logi-dev-mgr-kick|executable_login-window-layout|executable_mac-askpass|executable_mic-mute-toggle|executable_mullvad-settings-watch|executable_mx-ergo-pointer|executable_mx-ergo-resync|executable_mx-ergo-solaar|executable_mx-ergo-watch|executable_otel-savings-rollup|executable_otel-sweep-watch|executable_reap-backgrounded-origins-sweep|executable_retention-sweep|executable_spares|executable_steam|executable_streamcontroller-health|executable_sudo|executable_terminal-cheatsheet|executable_tmux-askpass|executable_tools-inventory|executable_wezterm-pane-ssh|executable_wpe|executable_wpe-watch|executable_xclip|executable_xsel)|home/private_dot_claude/sandbox/(executable_claude-sandbox|executable_vault-search)|home/private_dot_claude/vault-tooling/githooks/(pre-commit|pre-push))$)
