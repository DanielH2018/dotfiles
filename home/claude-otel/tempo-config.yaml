# Trace backend for Claude Code's enhanced-telemetry spans
# (interaction -> llm_request / tool -> tool.blocked_on_user + tool.execution).
# Spans arrive via the collector's traces pipeline, not directly from Claude Code.
#
# Tempo 3 runs this single binary with no Kafka. The 2.x `ingester:` block is gone: its
# successor, the live store, serves a span as soon as it arrives and cuts a block every
# 30s by default, so the 5m flush override this file carried for interactive reads has
# no 3.x counterpart worth setting.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# 30d. Shorter than Prometheus' 90d: spans are per-turn and far bulkier than counters,
# and trace-level debugging is retrospective by days, not months. Tempo 3 replaced the
# compactor with the backend scheduler and worker, which both read this compaction block;
# without it retention falls back to the 336h default.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 720h

backend_worker:
  compaction:
    block_retention: 720h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Tempo posts anonymous usage stats to grafana.com by default. This stack is
# deliberately local-only (127.0.0.1 binds throughout), so opt out.
usage_report:
  reporting_enabled: false
