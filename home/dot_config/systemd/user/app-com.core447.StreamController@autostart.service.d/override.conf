# Drop-in over the unit systemd-xdg-autostart-generator builds from
# ~/.config/autostart/com.core447.StreamController.desktop.
#
# That .desktop is written by the XDG Background portal (X-XDP-Autostart) every time
# the app starts, so it cannot usefully be deleted or replaced -- which is also why
# recovery hangs off this generated unit instead of a hand-written one. A second unit
# would race the portal's and produce two instances, the exact state that leaves the
# deck permanently dark.

[Unit]
# StreamController aborts from an upstream libdbus assertion (see
# streamdeck-usb-reset for the detail) roughly a few times a day, and each abort is
# independent -- so the restart budget is generous enough to ride those out while
# still refusing to loop on a genuinely broken deck.
StartLimitIntervalSec=1h
StartLimitBurst=5

[Service]
# Closing the app sends SIGTERM (exit 143); that is a normal quit, not a failure.
# This is load-bearing now that Restart= is set: without it, quitting the app would
# immediately bring it back and there would be no way to turn it off.
SuccessExitStatus=143

# The abort exits 134 (128+6), so it lands here and gets restarted. The generated
# unit ships Restart=no; this is the line that overrides it.
Restart=on-failure
# Long enough for the aborting process's USB handle to be reaped before the reset
# below goes looking for holders.
RestartSec=5

# The reset is what makes the restart actually work. A bare relaunch after an abort
# hits "Failed to write feature report (-1)" and leaves a running-but-deckless
# instance. Leading `-` because a missing or unplugged deck must not block startup;
# the script itself exits 0 in every no-op case, so this only covers the unexpected.
ExecStartPre=-%h/.local/bin/streamdeck-usb-reset
