[[apps.base]]
name = "Elgato Stream Deck"
winget = "Elgato.StreamDeck"
# Elgato ships no Linux software; StreamController is the community client, and the only one
# installed here on purpose — install exactly one. It drives the deck over libusb, which detaches
# the kernel usbhid driver and deletes the hidraw node, so any second Stream Deck client fights it
# for the device and leaves the hardware needing a physical replug to recover. The hidraw-based
# alternative was evaluated on 2026-07-31 and rejected: it renders to this deck (0fd9:006d) but
# never dispatches button presses, which no amount of udev, permission or profile work fixes.
#
# Actions come from plugins, NOT from the app: install OS (com_core447_OSPlugin) and Media
# (com_core447_MediaPlugin) from its store. OSPlugin's Run Command prepends `flatpak-spawn --host`
# itself inside a Flatpak, so commands must be plain host commands — adding the prefix yourself
# double-wraps it and fails silently, because detached mode discards stdout and stderr.
flatpak = "com.core447.StreamController"

[[apps.base]]
name = "playerctl"
# Linux-only. Controls any MPRIS-aware player (Spotify included) from the shell, which makes it
# the general-purpose answer for media keys and scripts. NOT required by the Stream Deck any more:
# StreamController's Media plugin speaks MPRIS itself, so the deck's prev/play-pause/next keys use
# that rather than shelling out. Kept because a CLI media control is independently useful; drop
# this entry if that stops being true.
dnf = "playerctl"
apt = "playerctl"

[[apps.base]]
name = "pavucontrol"
# Linux-only. Per-application volume and per-stream output routing — the bits KDE's own audio
# applet doesn't expose. Works against PipeWire through pipewire-pulse, which Fedora ships by
# default, so no PulseAudio daemon is involved despite the name.
dnf = "pavucontrol"
apt = "pavucontrol"

[[apps.base]]
name = "f.lux"
winget = "flux.flux"
# f.lux's Linux build is X11-only and unmaintained. gammastep is the Wayland-native equivalent;
# KDE Plasma's built-in Night Colour covers the same ground if you prefer no extra package.
dnf = "gammastep"
apt = "gammastep"

