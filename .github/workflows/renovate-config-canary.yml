name: renovate-config-canary

# Validates renovate.json against the Renovate release the hosted app runs, which is always the
# latest one. Mend deprecates config keys a release ahead and rolls its Renovate forward on its
# own cadence, so a config valid on the day it landed can stop being accepted with no commit
# here. When that happens the app stops opening PRs, and every pin ages silently again.
#
# Two triggers answer two questions. A pull_request or push that touches renovate.json checks
# the edit itself. The daily schedule checks an unchanged file against a Renovate that moved.
# Same shape as the homelab repo's renovate-config-canary.yml, which runs this check the same way.
#
# The validator is unpinned on purpose: pinning it would test the config against a Renovate the
# app no longer runs. It checks the schema only. Whether each custom manager still matches its
# file is tests/renovate-config.test.js, which runs in the CI gate.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [renovate.json]
  pull_request:
    paths: [renovate.json]

# No run here is a commit's verdict on anything but renovate.json, so a superseded run loses
# nothing the next one does not re-establish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate renovate.json against latest Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Renovate's own engine requirement (node ^24.11 as of Renovate 44), not this repo's
      # toolchain: tools.toml pins node 22 for the suite, which Renovate refuses to run on.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"

      # npm's `latest` tag names a new Renovate a few minutes before its tarball reaches every
      # CDN edge, and the fetch 404s in that window. The homelab repo measured it (issue #1269
      # there). The install is retried, since that failure is transport. The validation runs
      # once, since its exit code is the verdict.
      - name: Validate renovate.json
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/renovate"
          for attempt in 1 2 3 4 5 6; do
            if npm install --prefix "$prefix" --no-save --no-package-lock --no-audit --no-fund renovate@latest; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::renovate@latest did not install after $attempt attempts"
              exit 1
            fi
            echo "npm install failed; retrying in 60s (attempt $attempt of 6)"
            sleep 60
          done
          "$prefix/node_modules/.bin/renovate-config-validator" --strict renovate.json
