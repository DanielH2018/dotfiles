set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# OSC 8 hyperlinks (Claude Code artifact/file links). tmux strips them unless the
# client terminal advertises the feature, and it can't auto-detect Ghostty/WezTerm
# under TERM=xterm-256color — so declare it for every outer terminal we use.
set -as terminal-features '*:hyperlinks'
set -g mouse on
set -g history-limit 50000
set -g base-index 1

# Agent View picker (tmux backend). prefix+g opens agentview in a dedicated WINDOW; on
# <enter> it focuses the chosen session's pane via tmux select-pane. tmux is the portable
# substrate that makes the picker work under any outer terminal (incl. Ghostty).
#
# A window, NOT a display-popup: tmux allows only ONE popup per client, so a picker that was
# itself a popup could never float its CTRL+X / CTRL+N choosers above itself — tmux drops the
# nested request silently (rc=0, nothing drawn at all). The old 90%x90% popup and a window
# look nearly identical, so this costs a sliver of border and buys choosers that actually pop.
# -S reuses the window when it already exists, so repeated presses never stack up pickers.
bind g new-window -S -n agentview agentview
# prefix+G: start a NEW claude-sandbox session (pick repo + branch) without opening the
# picker first. Runs inside this client, so agentview's tmux backend opens the session in a
# new window of the current session.
bind G new-window -S -n agentview-new 'agentview --spawn'
# C-Left (no prefix): back to Agent View from inside any session pane — claude, a
# sandbox (docker), or a remote attach (ssh). The key is stolen ONLY when the pane's
# foreground process is not a shell; at a prompt it passes through and stays word-left
# (zsh binds ^[[1;5D backward-word in dot_zshrc.tmpl).
bind -n C-Left if -F '#{m/r:^-?(zsh|bash|fish|sh|login)$,#{pane_current_command}}' 'send-keys C-Left' 'new-window -S -n agentview agentview'
