global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the metrics the OTEL collector re-exposes from Claude Code's OTLP stream.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Scrape the collector's own health (otelcol_exporter_send_failed_*, queue size).
  # Separate job because :8889 carries the converted Claude Code metrics and :8888
  # carries the collector's internals — they are different endpoints, not one target
  # with two ports.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
