global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the metrics the OTEL collector re-exposes from Claude Code's OTLP stream.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Scrape the collector's own health (otelcol_exporter_send_failed_*, queue size).
  # Separate job because :8889 carries the converted Claude Code metrics and :8888
  # carries the collector's internals — they are different endpoints, not one target
  # with two ports.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # The backends themselves, purely so `up` exists for each one. Without these the
  # stack cannot answer "was Loki serving at 06:50?" after the fact: the collector
  # only reports its own health, and a container log is no substitute — Loki's had
  # rotated past the boot window by the time anyone asked. One scrape per backend
  # turns a post-mortem into a range query.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
