# Managed by chezmoi — edit home/.chezmoitemplates/warp-settings.toml, not the deployed copy.
#
# Shared body. Two thin wrappers include it, because Warp reads a different path per OS
# (docs.warp.dev/terminal/settings/file-locations): macOS keeps every user file under
# ~/.warp, Linux splits config into $XDG_CONFIG_HOME/warp-terminal and data into
# $XDG_DATA_HOME/warp-terminal. Deploying only the Linux paths is why this config did
# nothing on a Mac.
#
# WARP WRITES THIS FILE ITSELF. Every change made in Settings > ... lands there, and Warp
# records the result as `SettingsFileLastSyncedHash` in `user_preferences.json`. So this is
# not a write-once config: a UI change that is not copied back into this source is reverted
# by the next `chezmoi apply`, silently and with a clean `chezmoi diff` beforehand.
#
# The recapture step, after changing anything in Warp's settings UI — the source path is the
# one Warp writes on THIS machine, and copying the other one back captures nothing:
#   macOS:   cp ~/.warp/settings.toml                              <source>/home/.chezmoitemplates/warp-settings.toml
#   Linux:   cp ~/.config/warp-terminal/settings.toml              <source>/home/.chezmoitemplates/warp-settings.toml
#   Windows: cp "$LOCALAPPDATA/warp/Warp/config/settings.toml"     <source>/home/.chezmoitemplates/warp-settings.toml
# then restore this header and the three template actions below.
#
# Three things are templated, because Warp resolves nothing relative and a literal would
# deploy wrong under another user or OS:
#   - `default_tab_config_path`, an absolute path into the tab_configs dir
#   - `[session]`'s shell overrides, which name a Windows-only bash.exe
#   - `[system]`'s graphics keys, whose backend enum is Windows-only
#
# A recapture drops all three, and the deployed file stays valid TOML afterwards — so the
# tests in tests/terminal/warp-settings.test.js are the only thing that notices.

[terminal]
copy_on_select = true
use_audible_bell = true
osc52_clipboard_access = "read_write"

[terminal.input]
input_box_type_setting = "classic"
honor_ps1 = true

[agents]
cloud_conversation_storage_enabled = true

[agents.warp_agent]
is_any_ai_enabled = true

[agents.warp_agent.input]
nld_in_terminal_enabled = false

[agents.warp_agent.other]
show_agent_notifications = true
show_conversation_history = true
should_render_use_agent_toolbar_for_user_commands = false

[agents.execution_profiles]

[agents.execution_profiles.default]
apply_code_diffs = "always_ask"
ask_user_question = "always_ask"
autosync_plans_to_warp_drive = true
base_model = "auto-genius"
command_allowlist = []
command_denylist = [
  'bash(\s.*)?',
  'fish(\s.*)?',
  'pwsh(\s.*)?',
  'sh(\s.*)?',
  'zsh(\s.*)?',
  'curl(\s.*)?',
  'eval(\s.*)?',
  'exec(\s.*)?',
  'source(\s.*)?',
  'wget(\s.*)?',
  'dig(\s.*)?',
  'nslookup(\s.*)?',
  'host(\s.*)?',
  'ssh(\s.*)?',
  'scp(\s.*)?',
  'rsync(\s.*)?',
  'telnet(\s.*)?',
  'rm(\s.*)?',
]
computer_use = "never"
directory_allowlist = []
execute_commands = "agent_decides"
mcp_allowlist = []
mcp_denylist = []
mcp_permissions = "agent_decides"
name = "Default"
read_files = "always_allow"
run_agents = "always_ask"
web_search_enabled = true
write_to_pty = "always_ask"

[agents.third_party]
should_render_cli_agent_toolbar = true

[account]
is_settings_sync_enabled = false

[privacy]
telemetry_enabled = true
crash_reporting_enabled = true

[general]
# `tab_config` is what makes `default_tab_config_path` do anything — under any other mode
# Warp ignores that key, and local-shell.toml exists only to give this mode a row that runs
# nothing. A recapture had already reverted this to "terminal", which disabled the whole
# tab-config design silently: the `+` menu still worked, so nothing looked broken.
default_session_mode = "tab_config"
show_warning_before_quitting = false
default_tab_config_path = "{{ includeTemplate "warp-tab-configs-dir" . }}/local-shell.toml"
new_tab_placement = "after_all_tabs"
# Warp's own default, pinned rather than left implicit. It is what reopens the previous
# windows, tabs, panes and tab groups on launch, and it is a single toggle in the UI —
# so leaving it unset means one stray click loses the layout with nothing to revert to.
restore_session = true

[appearance]

[appearance.vertical_tabs]
enabled = true
display_granularity = "panes"
view_mode = "expanded"
primary_info = "command"
show_panel_in_restored_windows = true

[appearance.text]
notebook_font_size = 14.0
font_name = "IosevkaTerm Nerd Font Mono"
font_size = 18.0
font_weight = "bold"
ligature_rendering_enabled = true
match_ai_font = true
ai_font_name = "IosevkaTerm Nerd Font Mono"
line_height_ratio = 1.2000000476837158

[appearance.cursor]
cursor_display_type = "block"
cursor_blink = "enabled"

[appearance.panes]
should_dim_inactive_panes = true

[appearance.window]
open_windows_at_custom_size = true
new_windows_num_columns = 120
new_windows_num_rows = 24
zoom_level = 90

[appearance.themes]
theme = { custom = { name = "Catppuccin Mocha", path = "catppuccin_mocha.yaml" } }

[appearance.tabs]

[appearance.tabs.header_toolbar_chip_selection]

[appearance.tabs.header_toolbar_chip_selection.custom]
left = ["tabs_panel", "tools_panel"]
right = ["code_review", "notifications_mailbox"]

[code]

[code.editor]
show_code_review_button = true
show_project_explorer = true
show_global_search = true

[code.indexing]
agent_mode_codebase_context_auto_indexing = true

[warp_drive]
enabled = true

[notifications]
toast_duration_secs = 4

[terminal.input.extra_meta_keys]
left_alt = true
right_alt = false

[terminal.smart_select]
word_char_allowlist = "-.~/:"

[keys]
ctrl_tab_behavior_setting = "cycle_most_recent_session"

# Quieter cues in Warp. Claude Code sessions raised most of the traffic here, and the two
# noisiest categories were the ones announcing something FINISHING rather than something waiting
# on you. settings.base.json already excludes `agent_completed` from the Notification hook's
# matcher for that reason ("a finished session is not asking for anything"); this is the same
# call applied to Warp's own channel, so the two agree instead of one re-adding what the other
# suppressed.
#
# play_notification_sound = false makes Warp visual-only. It does NOT silence the cue that
# matters: notify.sh still fires on permission_prompt and agent_needs_input, and its native
# Windows branch plays the system beep .wav itself, through MediaPlayer at 25%. So a genuine
# block still chimes, on a channel gated on needing you and at a gain that is settable; only
# the unconditional toast chime is gone.
#
# use_audible_bell above is NOT what carries that cue any more. It was, while notify.sh fell
# through to play-sound.sh's terminal bell on Windows, and a bell is exactly the thing with no
# volume -- which is why the branch exists. It stays true only for whatever else rings it.
#
# long_running_threshold 30 -> 120 rather than is_long_running_enabled = false: at 30s every
# claude invocation qualified, which made the category meaningless. The feature is still worth
# having for a slow build, so raise the bar instead of removing it.
[notifications.preferences]
mode = "enabled"
is_long_running_enabled = true
long_running_threshold = 120
is_agent_task_completed_enabled = false
is_needs_attention_enabled = true
is_password_prompt_enabled = true
play_notification_sound = false

[privacy.secret_redaction]
enabled = true
hide_secrets_in_block_list = true
secret_display_mode_setting = "asterisks"

[warpify.ssh]
ssh_extension_install_mode = "always_install"
reuse_existing_control_master = true

[warpify.subshells]
added_subshell_commands = ["claude-sandbox", "toolbox enter", "podman exec"]

[session]
{{- if eq .chezmoi.os "windows" }}
# Windows only. Left unset, Warp opens PowerShell 7, which is not the shell anything else
# here is written for — every hook, script and tab config on this machine assumes bash.
#
# Both the shape and the path came from Warp itself: setting Settings > Features > Session >
# "Startup shell for new sessions" to Git Bash and reading back what Warp wrote. That step
# was not optional, because settings_schema.json describes this key wrongly twice over. It
# declares the MSYS2 variant as `m_s_y_s2`, where Warp writes `msys_2`. And it offers an
# `executable` variant that the deserializer does not accept — `{ executable = "<path>" }`
# parses as valid TOML and is then ignored in silence, with no error and no log line, while
# Warp goes on launching pwsh. Prefer what Warp writes over what its schema declares.
#
# The path is Git\usr\bin\bash.exe, not Git\bin\bash.exe. The latter is a 47 KB launcher
# shim; the former is the real MSYS2 bash, and it is the one Warp chose.
#
# Single-quoted because a TOML literal string takes the backslashes as written. Warp emits
# this form itself, and it survives Warp's own surgical rewrites unchanged.
startup_shell_override = 'C:\Program Files\Git\usr\bin\bash.exe'

[session.new_session_shell_override]
msys_2 = 'C:\Program Files\Git\usr\bin\bash.exe'
{{- end }}

# Where a session starts, set per source rather than globally. `advanced_mode` is the switch
# that makes the three tables below outrank `global`; with it off they are read and ignored.
#
# A tab config's own `directory` wins over all of this, so `new_tab` only decides the cases
# the `+` menu does not cover.
#
# `custom_dir` is required on every one of these tables, not just the ones using it —
# WorkingDirectoryPerSourceConfig lists both fields in `required`. Omitting it where the mode
# does not read it fails the whole WorkingDirectoryConfig, and Warp then falls back to its
# default for the entire setting rather than the one table at fault.
[session.working_directory_config]
advanced_mode = true

[session.working_directory_config.global]
mode = "previous_dir"
custom_dir = ""

[session.working_directory_config.new_tab]
mode = "previous_dir"
custom_dir = ""

[session.working_directory_config.new_window]
mode = "home_dir"
custom_dir = ""

# A split is nearly always a second view onto the work already in the pane, so inheriting the
# directory saves the `cd` that would otherwise follow every split.
[session.working_directory_config.split_pane]
mode = "previous_dir"
custom_dir = ""

[experimental]
# Keeps the UI painting while a find runs over a large scrollback.
async_find_enabled = true
{{- if eq .chezmoi.os "windows" }}

[system]
# Windows only. `prefer_low_power_gpu` defaults to true, which asks for the integrated GPU.
# There is none on this machine, so the request is moot rather than harmful — it is set false
# to say so explicitly, and because the same file deploys to machines where it would differ.
#
# `preferred_graphics_backend` is deliberately absent. Two reasons, and the second is the one
# that decides it:
#
#   - No spelling of the value is derivable from what Warp ships. Its settings_schema.json
#     declares the consts snake_case (`dx12`, `vulkan`, `browser_web_gpu`); warp.exe carries
#     the variant table as `EmptyDx12VulkanGlMetalBrowserWebGpu`. Both `"dx12"` and `"Dx12"`
#     were rejected at load with `Failed to parse file value for setting
#     [setting=PreferredGraphicsBackend]`, so the schema is not the reference for this key and
#     the runtime spelling is unknown. Reading it back out of Warp's own settings UI is the
#     only reliable way to learn it.
#   - It would buy nothing here. Warp already picks the backend this setting would name:
#     `Using Dx12 DiscreteGpu (NVIDIA GeForce RTX 3080 Ti) for rendering new window`. It gets
#     there on its own by deprioritizing non-DX12 Nvidia adapters on drivers past version 572
#     (this one is 610.88), because they can crash when several windows are open.
prefer_low_power_gpu = false
{{- end }}
