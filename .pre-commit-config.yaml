repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # `files:` is a WIDENER here, not an allowlist. It once was an allowlist, reaching
      # only 23 of the repo's 51 Python files, so config-map, vault-index, quality/ and a
      # hook went ungated; that is gone, and `\.py$` now admits every Python file in the
      # repo the way pre-commit resolving the list itself would.
      #
      # The named alternatives are maintained by hand, and naming one is only HALF of what
      # it takes. `files:` and `types_or:` are ANDed, and `types_or: [python]` types a file
      # by extension, or by shebang only if the file is EXECUTABLE. An extensionless script
      # therefore needs BOTH: a name here AND a +x bit in git. That is easy to get wrong,
      # because chezmoi's executable_ prefix sets the DEPLOYED mode, so a 100644 source
      # still deploys as 0755 and nothing looks broken — executable_jsonq sat at 100644 and
      # went unlinted for its whole existence. It passes ruff today, which is luck, not
      # evidence. Adding an extensionless Python script means naming it below and
      # `git update-index --chmod=+x`.
      - id: ruff-check
        types_or: [python]
        files: (\.py$|^home/dot_local/bin/executable_(tq|jsonq|otelq|otel-sweep|prompt-friction|streamdeck-usb-reset|wl-bmp2png|wpe-pick)$)

  - repo: local
    hooks:
      # Nothing ran shellcheck before this except the same edit hook. Settings live in
      # .shellcheckrc so this and the hook agree without either passing flags.
      #
      # `language: system` against the installed binary, NOT koalaman/shellcheck-precommit:
      # that hook is a docker_image, and docker here is the rootless-podman shim, which
      # re-pulls the image per batch and then cannot read the bind-mounted files
      # ("openBinaryFile: permission denied" — the :z / --userns=keep-id problem). The
      # system binary has none of that and is already a dependency of lint-after-edit.
      #
      # .chezmoitemplates/linux-install.sh is excluded because it is a Go template that
      # happens to end in .sh — shellcheck cannot parse `{{/* ... */}}` and reports a
      # syntax error on line 1 regardless of the shell below it.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: ^home/\.chezmoitemplates/

      # dot_bashrc and dot_zshenv are shell and were checked by nothing. An rc file is
      # sourced, never executed, so it carries no shebang and (correctly) no +x bit; with no
      # extension either, `types: [shell]` above cannot identify one and skipped both
      # silently -- verified with `prek run shellcheck --files home/dot_bashrc`, which
      # answers "(no files to check)".
      #
      # A second hook rather than a wider `files:` on the one above, because `files` and
      # `types` are ANDed: naming them there would ALSO require them to type as shell, and
      # for an extensionless file that means a +x bit, which is the one thing an rc file
      # must not have. Omitting `types` here defaults it to `[file]`, so the name alone
      # decides. Each file declares its own dialect with an in-file `# shellcheck shell=`
      # directive -- there is no shebang to infer it from.
      - id: shellcheck-rc
        name: shellcheck (rc files)
        entry: shellcheck
        language: system
        files: ^home/(dot_bashrc|dot_zshenv)$

      # The *.sh.tmpl scripts -- the run_once_/run_onchange_ ones chezmoi executes during
      # apply, which are also the ones that call sudo -- were outside every gate for the
      # same extension reason: `.sh.tmpl` is not `.sh`. They cannot be linted in place
      # (Go template syntax is a shell parse error, the same reason .chezmoitemplates/ is
      # excluded above), so bin/lint-sh-templates renders each one through chezmoi and
      # lints the result. See that file for why --source matters in a worktree.
      - id: shellcheck-templates
        name: shellcheck (rendered chezmoi templates)
        entry: bin/lint-sh-templates
        language: system
        files: \.sh\.tmpl$

      # JavaScript is the largest language here (153 .js + 26 .mjs) and nothing linted it.
      # oxlint rather than eslint because this repo has no package.json and no node_modules
      # on purpose -- the suite is plain `node --test` -- so the linter has to be a single
      # binary run as `language: system`, exactly like ruff and shellcheck above. Rules and
      # the reasoning behind the three that are off live in .oxlintrc.json, which oxlint
      # discovers from the repo root on its own.
      #
      # It runs through bin/lint-js rather than calling oxlint directly, for two reasons that
      # both make a bare `entry: oxlint` silently useless. oxlint selects files by EXTENSION
      # and refuses anything else ("No files found to lint"), which would exclude the five
      # extensionless `#!/usr/bin/env node` scripts -- among them bin/config-soak, itself a
      # push gate. And every rule in the default correctness category reports at WARNING
      # severity, where oxlint exits 0: without --deny-warnings the hook would print findings
      # and pass. See that script for how both are handled.
      #
      # `files:` is a WIDENER, the same way it is on ruff-check: it is ANDed with types_or,
      # so it admits those extensionless scripts, which `javascript` cannot type by
      # extension. They need the +x bit in git as well, since a shebang only types a file
      # that is executable -- four of the five sat at 100644 and were set executable in the
      # commit that added this hook. Adding another extensionless node script means doing
      # both: name it here AND `git update-index --chmod=+x`.
      #
      # Deliberately NOT skip-if-absent, unlike bin/lint-sh-templates: chezmoi is already a
      # hard dependency of working in this repo, but oxlint is new and installed nowhere
      # until `chezmoi apply` runs post-install/run_onchange_after_install-js-lint.sh.tmpl.
      # A hook that quietly skips when its tool is missing would be a no-op on every machine
      # -- which is the failure this whole change exists to fix.
      - id: oxlint
        name: oxlint (javascript)
        entry: bin/lint-js
        language: system
        types_or: [javascript]
        files: (\.(js|mjs)$|^(bin/config-soak|home/dot_local/bin/executable_(claude-settings-merge|dotsync|terminal-cheatsheet|tools-inventory))$)

      # One audit found four GNU-only shell idioms in a single session -- bare `sed -i`, `\b`
      # inside a bash [[ =~ ]] regex, and an mktemp template with a suffix after the X's. All
      # four passed every gate here, because all four are correct on the Linux hosts they were
      # written on and only misbehave on BSD/macOS userland. One was a live bypass in
      # block-dangerous-bash.sh. bin/lint-bsd-portability is the cheap textual check; its
      # header carries the three commits and what it deliberately does not catch.
      #
      # `files:` with no `types:`, following shellcheck-rc above. The set spans shell, .sh.tmpl
      # and .js, and `files` is ANDed with `types` -- a .sh.tmpl types as text, not shell, so
      # naming `types: [shell]` here would drop every template. The alternation therefore has
      # to name the extensionless script directories itself; `[^/.]+$` keeps that to files with
      # no extension, since anything with one is already covered by the first branch.
      # tests/lint-bsd-portability.test.js asserts this pattern still admits every file
      # `bin/lint-bsd-portability --list` derives, so the two cannot drift apart silently.
      #
      # Suppressions live in the script, not in an `exclude:` here, so that a manual run and a
      # commit-time run agree on what is checked.
      - id: bsd-portability
        name: BSD/macOS shell portability
        entry: bin/lint-bsd-portability
        language: system
        files: (\.(sh|bash|zsh|js|mjs|cjs)$|\.sh\.tmpl$|^(\.githooks|bin|home/dot_local/bin|home/private_dot_claude/sandbox|home/private_dot_claude/vault-tooling/githooks)/[^/.]+$|^home/\.chezmoitemplates/(is-[a-z-]+|require-[a-z-]+)$|^home/(dot_bashrc|dot_zshenv)$)
