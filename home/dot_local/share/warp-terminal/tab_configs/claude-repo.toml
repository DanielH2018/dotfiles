name = "Claude · pick a repo"
title = "claude-repo"
color = "cyan"

# Replaces `agentview --spawn`: prompts for a repo, then a branch, at launch.
[params.repo]
type = "repo"
description = "Repository"

[params.branch]
type = "branch"
description = "Branch"

[[panes]]
id = "main"
type = "terminal"
directory = "{{repo}}"
is_focused = true
commands = ["git switch {{branch}}", "claude"]
