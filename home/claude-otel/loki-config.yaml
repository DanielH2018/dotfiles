# Minimal single-binary Loki (filesystem storage) with OTLP ingestion enabled.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP log ingestion (resource/scope attributes -> structured metadata).
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 744h   # 31 days
  # Prompts, responses and tool output arrive as structured metadata, and Claude Code
  # only truncates them at CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH (60K UTF-16 units — more
  # than 64KB once encoded). At Loki's 64KB default the whole event is rejected, not
  # merely the oversized field, so a long turn would vanish from the log entirely.
  max_structured_metadata_size: 512KB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
