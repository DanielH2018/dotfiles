# yazi main config — managed by chezmoi.
# Plugins & flavor are vendored via `ya pkg install` (see package.toml);
# their wiring lives in init.lua and theme.toml.

[mgr]
ratio = [1, 4, 3]      # parent : current : preview
show_hidden = true     # toggle at runtime with `.`
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
show_symlink = true
linemode = "size"

[preview]
max_width = 1200
max_height = 1200

# git.yazi: run the git fetcher over files and directories so the plugin can
# render per-file status as a linemode. `id` is omitted (yazi > v26.1.22).
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

# piper + glow: render markdown in the preview pane (dark style, pane width).
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# piper + bat: line-numbered, syntax-highlighted previews for structured/tabular
# files, themed with the vendored Catppuccin Mocha bat theme; width tracks the pane.
[[plugin.prepend_previewers]]
url = "*.csv"
run = 'piper -- bat --color=always --style=numbers --theme="Catppuccin Mocha" --terminal-width=$w "$1"'

[[plugin.prepend_previewers]]
url = "*.tsv"
run = 'piper -- bat --color=always --style=numbers --theme="Catppuccin Mocha" --terminal-width=$w "$1"'

[[plugin.prepend_previewers]]
url = "*.json"
run = 'piper -- bat --color=always --style=numbers --theme="Catppuccin Mocha" --terminal-width=$w "$1"'

[[plugin.prepend_previewers]]
url = "*.jsonl"
run = 'piper -- bat --color=always --style=numbers --theme="Catppuccin Mocha" --terminal-width=$w "$1"'

[[plugin.prepend_previewers]]
url = "*.log"
run = 'piper -- bat --color=always --style=numbers --theme="Catppuccin Mocha" --terminal-width=$w "$1"'

# Openers. `edit` (Enter/l on text) → helix, in-terminal; non-text → macOS
# `open` (yazi default); markdown → a full-screen glow reader. `$EDITOR` and the
# `e` bind stay vim for actual editing.
[opener]
edit = [{ run = "hx %s", block = true, desc = "Helix", for = "unix" }]
reader = [
  { run = "glow -p %s", block = true, desc = "Read (glow)", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.md", use = [
    "reader",
    "edit",
    "reveal",
  ] },
  { url = "*.markdown", use = [
    "reader",
    "edit",
    "reveal",
  ] },
]
