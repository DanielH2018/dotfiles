[project]
name = "vault-index"
version = "0.1.0"
description = "Local hybrid-search index over the LLM Wiki vault (semantic + BM25)"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1.0", "fastembed>=0.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vault-index = "vault_index.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vault_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
