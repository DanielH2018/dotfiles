name: claude-otel

# Local, self-hosted observability stack for Claude Code telemetry.
# Everything binds to 127.0.0.1 only — nothing is exposed on the network.
# Claude Code (running on the WSL host) exports OTLP -> otel-collector:4317,
# which fans metrics out to Prometheus and event logs out to Loki; Grafana reads both.

# The daemon default (unrotated json-file) grows without bound on always-on services.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC  <- Claude Code exports here
      - "127.0.0.1:4318:4318"   # OTLP HTTP  (alternative)
      - "127.0.0.1:8889:8889"   # Prometheus scrape endpoint (collector -> prom)
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    logging: *logging

  loki:
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    logging: *logging

  # Named volumes are created root-owned; Tempo runs as uid 10001 and would fail to
  # write its WAL. One-shot chown, as in Grafana's own local-stack example.
  tempo-init:
    image: grafana/tempo:2.8.1
    user: root
    entrypoint: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    restart: "no"
    logging: *logging

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # Tempo query API (Grafana reads here)
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Frictionless local access: anonymous admin, no login form. Safe because
      # the port is bound to 127.0.0.1 only.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    logging: *logging

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
