# Core CLI toolchain shared across platforms — the single source of truth for the tools
# installed on more than one OS. Each installer consumes the field(s) for its own package
# manager and ignores the rest:
#   - winget = winget package id      -> run_onchange_install-cli-tools.ps1.tmpl  (Windows)
#   - brew   = Homebrew formula       -> Brewfile.tmpl                             (macOS)
#   - apt    = Debian/Ubuntu package  -> run_onchange_after_install-cli-tools.sh.tmpl  (Linux)
#   - dnf    = Fedora/RHEL package    -> run_onchange_after_install-cli-tools.sh.tmpl  (Linux)
#   - cmd    = binary name on PATH    -> used by the winget installer to skip-if-present
# An empty field means that installer doesn't handle this tool (it's absent there, or
# installed by another mechanism — e.g. eza/fastfetch come from GitHub release binaries on
# Linux, handled bespoke in the .sh script, so their apt/dnf fields are empty here).
#
# apt and dnf are deliberately kept in lockstep: a tool that comes from a GitHub release
# binary on Debian comes from one on Fedora too, even where Fedora happens to package it
# (eza, ripgrep, fzf, zoxide and fastfetch all exist in the Fedora repos). The same binaries
# on every Linux beats "whatever this distro shipped", and it keeps one code path under test.
# The dnf field therefore differs from apt only in package NAMING, never in coverage.
#
# OS-UNIQUE tools stay in their own installer, NOT here: winget's uv,
# and the Brewfile's casks / mas / vscode / brew-only (bash, chezmoi, gh, tmux, wget, ...).

[[tools]]
name = "bat"
cmd = "bat"
winget = "sharkdp.bat"
brew = "bat"
apt = "bat"
# Fedora ships the binary as /usr/bin/bat, not Debian's renamed `batcat`, so the real-name
# symlink step in the installer simply no-ops here.
dnf = "bat"

[[tools]]
name = "eza"
cmd = "eza"
winget = "eza-community.eza"
brew = "eza"
apt = ""
dnf = ""

[[tools]]
name = "fd"
cmd = "fd"
winget = "sharkdp.fd"
brew = "fd"
apt = "fd-find"
# Same package name as Debian, but Fedora installs /usr/bin/fd directly (no `fdfind`).
dnf = "fd-find"

[[tools]]
name = "fzf"
cmd = "fzf"
winget = "junegunn.fzf"
brew = "fzf"
apt = ""
dnf = ""

[[tools]]
name = "jq"
cmd = "jq"
winget = "jqlang.jq"
brew = "jq"
apt = "jq"
dnf = "jq"

[[tools]]
name = "ripgrep"
cmd = "rg"
winget = "BurntSushi.ripgrep.MSVC"
brew = "ripgrep"
apt = ""
dnf = ""

[[tools]]
name = "shellcheck"
cmd = "shellcheck"
winget = "koalaman.shellcheck"
brew = "shellcheck"
apt = "shellcheck"
# Fedora capitalises the package name (the binary stays lowercase `shellcheck`).
dnf = "ShellCheck"

[[tools]]
name = "starship"
cmd = "starship"
winget = "Starship.Starship"
brew = "starship"
apt = ""
dnf = ""

[[tools]]
name = "zoxide"
cmd = "zoxide"
winget = "ajeetdsouza.zoxide"
brew = "zoxide"
apt = ""
dnf = ""

[[tools]]
name = "fnm"
cmd = "fnm"
winget = "Schniz.fnm"
brew = "fnm"
apt = ""
dnf = ""

[[tools]]
name = "fastfetch"
cmd = "fastfetch"
winget = "Fastfetch-cli.Fastfetch"
brew = "fastfetch"
apt = ""
dnf = ""

[[tools]]
name = "chafa"
cmd = "chafa"
winget = ""
brew = "chafa"
apt = "chafa"
dnf = "chafa"

[[tools]]
name = "zsh"
cmd = "zsh"
winget = ""
# macOS ships zsh (the .zshrc targets the system /bin/zsh); brew's parallel zsh would
# only fork the login-shell path. Linux/WSL need it from apt. run_once_after_set-default-shell
# then chsh's to it.
brew = ""
apt = "zsh"
dnf = "zsh"

[[tools]]
name = "zsh-autosuggestions"
cmd = ""
winget = ""
brew = "zsh-autosuggestions"
apt = "zsh-autosuggestions"
# Fedora installs to the same /usr/share/zsh-autosuggestions/... path dot_zshrc.tmpl already
# probes, so no shell-config change is needed.
dnf = "zsh-autosuggestions"

[[tools]]
name = "zsh-syntax-highlighting"
cmd = ""
winget = ""
brew = "zsh-syntax-highlighting"
apt = "zsh-syntax-highlighting"
dnf = "zsh-syntax-highlighting"

[[tools]]
name = "inotify-tools"
cmd = "inotifywait"
# Backs agentview's picker-open watch loop (rows.sh: av_watch_once) on WSL and both servers.
# Linux-only kernel feature -- no winget/brew equivalent, so the watch falls back to a plain
# timer wherever this package is missing (see AV_WATCH_INTERVAL in rows.sh).
winget = ""
brew = ""
apt = "inotify-tools"
dnf = "inotify-tools"

[[tools]]
name = "script"
cmd = "script"
# Not a shell-experience tool -- it is what tests/chezmoi/chezmoi-scripts.test.js uses to hand the
# rendered set-default-shell script a pty, so the interactive chsh branch can be exercised.
# Debian and macOS both ship it in their base system, which is why apt and brew are empty and
# nobody noticed it was a dependency. Fedora splits it out of util-linux into its own package,
# so a stock Fedora box fails those tests until this lands. Windows has no equivalent and does
# not run that suite.
winget = ""
brew = ""
apt = ""
dnf = "util-linux-script"

# --- Pinned upstream versions ---------------------------------------------------------------
# Everything below is a version this repo used to resolve at install time. A laptop provisioned
# today, CI running today and a machine provisioned last month all took whatever was current on
# their own date, from the same commit. These literals make the commit the answer instead.
#
# Each pin carries a `# renovate:` line naming the datasource, so one custom manager per
# datasource keeps them current — a bump is a commit, reviewed like any other.
#
# The install scripts embed these values at render time, so a bump changes the rendered script
# and `run_onchange_` re-runs it. That is the whole trigger: there is no clock anywhere.

# GitHub release tags for the binaries os-linux/run_onchange_after_install-cli-tools.sh.tmpl installs
# where the distro packages one too old or not at all. The TAG is stored, not a stripped
# version, because the prefix is not consistent upstream — ripgrep and fastfetch publish a bare
# `15.2.0`, everything else a leading `v`. linux-install.sh's `_asset_url` derives `{ver}` from
# `{tag}` for the assets that want it, so one field serves both spellings.
[releases]
# renovate: datasource=github-releases depName=eza-community/eza
eza = { repo = "eza-community/eza", tag = "v0.23.5" }
# renovate: datasource=github-releases depName=fastfetch-cli/fastfetch
fastfetch = { repo = "fastfetch-cli/fastfetch", tag = "2.71.0" }
# renovate: datasource=github-releases depName=starship/starship
starship = { repo = "starship/starship", tag = "v1.27.0" }
# renovate: datasource=github-releases depName=junegunn/fzf
fzf = { repo = "junegunn/fzf", tag = "v0.75.0" }
# renovate: datasource=github-releases depName=ajeetdsouza/zoxide
zoxide = { repo = "ajeetdsouza/zoxide", tag = "v0.10.0" }
# renovate: datasource=github-releases depName=BurntSushi/ripgrep
rg = { repo = "BurntSushi/ripgrep", tag = "15.2.0" }
# renovate: datasource=github-releases depName=ryanoasis/nerd-fonts
nerd-fonts = { repo = "ryanoasis/nerd-fonts", tag = "v3.5.1" }

# The machine-global developer toolchain. Every one of these was `uv tool install <bare name>`,
# `npm install -g <bare name>` or an unversioned vendor install script, in the machine installer
# AND in `.github/workflows/ci.yml` — so CI and a laptop ran different builds of the hook runner
# that decides whether a push is clean. CI reads these same values out of this file.
#
# python must equal DanielH2018/server's `host_python_version`: the server's units run uv with
# --no-python-downloads against the Python this repo installs, so bump it here first. Since the
# server's H7.62 (2026-11-07) this repo is the only installer of the per-user uv and prek, and
# their pins are this file's alone. Before H7.62 the server pinned all three, and a value that
# differed made each apply undo the other. 2026-10-24: these were 0.12.14,
# 0.5.3 and 3.14.7, and were moved to the server's values (H7.38).
[toolchain]
# renovate: datasource=pypi depName=prek
prek = "0.5.10"
# renovate: datasource=pypi depName=ruff
ruff = "0.16.1"
# renovate: datasource=github-releases depName=astral-sh/uv
uv = "0.13.7"
# renovate: datasource=github-releases depName=twpayne/chezmoi
chezmoi = "2.74.0"
# renovate: datasource=npm depName=oxlint
oxlint = "1.93.0"
# The two language runtimes .github/workflows/ci.yml sets up, three-part: a two-part request
# leaves the patch level to resolve at run time, so two runs of one commit can use different
# interpreters. The machines take node from fnm, so no template renders that one. Python is
# rendered: install-python-tools installs this exact version with uv.
# renovate: datasource=node-version depName=node
node = "22.23.4"
# renovate: datasource=python-version depName=python
python = "3.15.2"

# The hosts whose Claude agent user gets uv, Python and prek from install-python-tools. It is
# the server repo's `dev_tooling_hosts` (inventory/group_vars/all.yml), the same list
# that gates Ansible's own install of them, and an operator apply is not gated by it. daniel-pi
# is absent for the reason given there: nobody commits from it, and it has 512 MB.
[agent_tooling]
hosts = ["daniel-box", "daniel-server"]
