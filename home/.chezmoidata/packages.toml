# Dev tooling not covered by the CLI-tools installers.
# ---------------------------------------------------------------------------------------------

[[apps.coding]]
name = "Git"
winget = "Git.Git"
dnf = "git"
apt = "git"

[[apps.coding]]
name = "GitHub CLI"
winget = "GitHub.cli"
manual = "Installed on Linux by os-linux/run_after_install-cli-tools.sh.tmpl, which also adds cli.github.com's apt repo so Ubuntu doesn't pin gh at 2.45. Deliberately not duplicated here."

[[apps.coding]]
name = "Visual Studio Code"
winget = "Microsoft.VisualStudioCode"
repo = "vscode"
dnf = "code"
apt = "code"

[[apps.coding]]
name = "Windows Terminal"
winget = "Microsoft.WindowsTerminal"
manual = "Windows-only by definition. Ghostty (below) is the Linux terminal; WezTerm is installed by the CLI-tools script for its headless mux-server."

[[apps.coding]]
name = "age"
winget = "FiloSottile.age"
dnf = "age"
apt = "age"

[[apps.coding]]
name = "Bitwarden CLI"
winget = "Bitwarden.CLI"   # `bw` — pulls the WireGuard config at provision time
# Bitwarden tags its CLI releases `cli-vYYYY.M.P`, so the releases/latest redirect that
# latest_tag() follows resolves the *desktop* release instead. Handled bespoke in the installer.
bw_cli = true

[[apps.coding]]
name = "scrcpy"
winget = "Genymobile.scrcpy"
# Genymobile develops scrcpy on Linux, so it is at least as useful here as on Windows. Debian and
# Ubuntu package it; Fedora does not (no rpms/scrcpy in dist-git, zero Bodhi updates as of
# 2026-07-31), so Fedora takes the upstream release tarball instead.
apt = "scrcpy"
tarball = "Genymobile/scrcpy"
tarball_bin = "scrcpy"
tarball_url = "https://github.com/Genymobile/scrcpy/releases/download/{tag}/scrcpy-linux-{arch}-{tag}.tar.gz"

[[apps.coding]]
name = "Ghostty"
# The terminal this config targets on macOS and Linux (dot_config/ghostty). Neither distro
# packages it: Fedora uses the COPR that ghostty.org's own install docs point at; Debian/Ubuntu
# use the .deb from mkasberg/ghostty-ubuntu, which the same docs recommend.
copr = "scottames/ghostty"
dnf = "ghostty"
ghostty_deb = true

# ---------------------------------------------------------------------------------------------
# Game launchers only (never individual games).
# ---------------------------------------------------------------------------------------------

[[apps.gaming]]
name = "Steam"
winget = "Valve.Steam"
# Fedora keeps Steam in RPM Fusion nonfree; Debian/Ubuntu have it in multiverse/non-free.
repo = "rpmfusion"
