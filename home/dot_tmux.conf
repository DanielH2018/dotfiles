set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mouse on
set -g history-limit 50000
set -g base-index 1

# Agent View picker (tmux backend). prefix+g opens agentview in a popup; on <enter>
# it focuses the chosen session's pane via tmux select-pane. tmux is the portable
# substrate that makes the picker work under any outer terminal (incl. Ghostty).
bind g display-popup -E -w 90% -h 90% agentview
# prefix+G: start a NEW claude-sandbox session (pick repo + branch) without opening the
# picker first. The popup runs inside this client, so agentview's tmux backend opens the
# session in a new window of the current session.
bind G display-popup -E -w 90% -h 90% 'agentview --spawn'
# C-Left (no prefix): back to Agent View from inside any session pane — claude, a
# sandbox (docker), or a remote attach (ssh). The key is stolen ONLY when the pane's
# foreground process is not a shell; at a prompt it passes through and stays word-left
# (zsh binds ^[[1;5D backward-word in dot_zshrc.tmpl).
bind -n C-Left if -F '#{m/r:^-?(zsh|bash|fish|sh|login)$,#{pane_current_command}}' 'send-keys C-Left' 'display-popup -E -w 90% -h 90% agentview'
