set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# OSC 8 hyperlinks (Claude Code artifact/file links). tmux strips them unless the
# client terminal advertises the feature, and it can't auto-detect Ghostty/WezTerm
# under TERM=xterm-256color — so declare it for every outer terminal we use.
set -as terminal-features '*:hyperlinks'
# Claude Code's fullscreen TUI repaints on focus-in, and tmux swallows the terminal's focus
# reports unless this is on (it defaults to off). Opening a Ghostty split with super+d moves
# focus off the Claude pane, so without this the pane stays stale until a scroll forces a
# redraw — Claude itself warns "tmux focus-events off" in its footer when it detects this.
set -g focus-events on
# A Claude session names itself by writing an OSC 0 title (warp-session-title.sh). Inside
# tmux that escape sets tmux's own pane_title and goes no further, so the outer terminal
# keeps whatever title it started with. Forwarding pane_title outward reconnects the chain.
# Warp no longer needs this — nothing it runs goes through tmux — but Ghostty still does,
# and it is what any future tmux session would need to name itself.
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g mouse on
# OSC 52 clipboard writes from applications, not just from tmux's own copy-mode. The default
# is `external`, which sets the outer terminal's clipboard when tmux copies but silently
# DISCARDS the escape when an application emits it — verified: at `external` a pane printing
# \033]52;c;<base64>\007 leaves `show-buffer` empty; at `on` the payload lands in a buffer.
# That is the whole copy path for a TUI running over ssh (Claude Code included), and it dies
# at the first tmux layer, so nothing reaches Ghostty.
#
# The tradeoff `external` exists to avoid: any process in any pane can now overwrite the
# system clipboard without a prompt. Ghostty's own `clipboard-write = allow` default already
# permits that for unwrapped sessions, so this only closes the gap tmux opened.
set -g set-clipboard on
set -g history-limit 50000
set -g base-index 1

# ---- Catppuccin Mocha, matching the terminal (chezmoi `.chezmoidata/terminal.toml`) ----
# tmux's stock status bar is green, so an otherwise all-Mocha screen had a strip of a
# different theme pinned across the bottom of every session. Set directly rather than via a
# theme plugin: there's no TPM in this config, and a status line is not worth a dependency.
# Text on an accent background is crust, never white — Mocha's accents are pastel, so light
# text on them is unreadable (the same rule the starship palette documents).
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left '#[bg=#89b4fa,fg=#11111b,bold] #S '
set -g status-left-length 30
set -g status-right '#[fg=#a6adc8] %H:%M #[bg=#313244,fg=#cdd6f4] #h '
set -g status-right-length 40
setw -g window-status-format '#[fg=#6c7086] #I #W '
setw -g window-status-current-format '#[bg=#313244,fg=#cba6f7,bold] #I #W '
setw -g window-status-activity-style 'fg=#f9e2af,none'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#313244,fg=#cdd6f4'
set -g display-panes-colour '#6c7086'
set -g display-panes-active-colour '#89b4fa'
set -g clock-mode-colour '#89b4fa'
