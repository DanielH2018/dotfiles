# gitleaks ruleset for claude-transcript-scan's DAILY run.
#
# The scanner exists to catch a credential that reached a session transcript. It runs
# unattended once a day, and an unattended check is only worth having if going red means
# something. The first real sweep, 2026-08-29, returned 52 findings across 82 transcripts;
# 45 were `generic-api-key` and every one that was chased to ground was a false positive:
#
#   secretKeyRef:                          a Kubernetes field NAME
#   authelia_secret:                       a SOPS key name, no value on the line
#   "<39 chars>",  # setup/fake_remux cron a SOPS key name in a Python list
#                                          (scripts/secrets_mgmt/secret_rotation.py:140)
#   <LONG>, <LONG> = 14.8359375            a metric line
#
# The rule matches on entropy with no key/value structure required, and a transcript is
# full of long high-entropy identifiers — SHAs, UUIDs, container ids, base64 blobs, and
# the names of secrets rather than the secrets themselves. Left on, the daily unit goes red
# every day on findings that can never be cleared, and a check nobody trusts caps nothing.
#
# Only `generic-api-key` is disabled, and only because there is measured evidence for it.
# Every named, structured rule stays on — github-pat, the aws-*, slack-*, stripe-*,
# private-key and the rest — and those are what actually found something: the 7 github-pat
# hits on the first sweep were a real token shape, correctly matched.
#
# The trade is explicit. `generic-api-key` is the rule that flagged the Sonarr and Radarr
# admin passwords in a `/api/v3/config/host` dump, so disabling it costs that class of
# catch on the daily run. `claude-transcript-scan --paranoid` runs the full default ruleset
# and is the way to get it back for a deliberate audit.
#
# Measured before shipping, on a 1,047,079-byte live transcript:
#   default ruleset  1 finding
#   this config      0 findings
[extend]
useDefault = true
disabledRules = ["generic-api-key"]

# The suite's own fixtures. Neither string has ever been a credential — both are synthetic
# `ghp_` shapes written to prove the scanner can go red, and they live in
# tests/claude-transcript-scan.test.js.
#
# They have to be allowlisted because a fixture in a committed file PROPAGATES. Any session
# that reads that test file copies the token into its own transcript, and the next sweep
# flags it there — measured 2026-08-29, six github-pat findings in another session's
# transcript, every one of them a line of this repo's own test source. Left alone, a
# synthetic token in a fixture is a permanent, self-renewing false positive in every session
# that ever opens the file, and it is indistinguishable from the real thing at a glance.
#
# Allowlisting the literals is the deterministic fix. Generating the fixture at runtime was
# the alternative and is worse: it trades a known-fake constant for a test whose input
# entropy varies per run, and gitleaks discards low-entropy candidates — which is exactly how
# the first version of that fixture (`ghp_AAAA…`) reported clean against a working scanner.
[[allowlists]]
description = "synthetic tokens from tests/claude-transcript-scan.test.js — never real"
regexes = [
  "ghp_9tQz3XbW7kR2mYvL8pJdN4sH6cF1aE0uG5iT",
  "ghp_4kM8vB2nQ7wR5xT9zY1cD3fH6jL0pS8uA2eG",
]

# Two vendor rules, each allowlisted for the one public-text shape that was triaged on it.
# Both raised the statusline alert in October 2026, and neither held anything to rotate:
#
#   cloudflare-ddns.json: "<40 hex>"                 a git commit SHA keyed by a role's file name
#   '<name>_discord_webhook', '<snake_case name>'    a SOPS key NAME beside another key name
#
# Each rule matches a vendor word, a separator, then ANY run of the right length, so an
# identifier of that length fits as readily as a credential does. targetRules scopes each
# allowlist to the rule that fired, because the same shape can be a real credential under a
# different rule: GitHub's legacy OAuth tokens were 40 lowercase hex characters.
#
# Neither pattern can hide a real secret of its own rule. A Cloudflare API token is 40
# characters and a Discord client secret is 32, both drawn from a mixed-case alphabet. A
# random draw that lands entirely in lowercase hex has odds near 2^-80. A draw that lands in
# lowercase snake_case, with no uppercase character, has odds near 10^-8.
#
# Mirrored in transcript-scan-loki.toml, because both rules are live in the Loki arm too.
[[allowlists]]
description = "a git commit SHA beside the word cloudflare — not a Cloudflare API token"
targetRules = ["cloudflare-api-key"]
regexes = [
  "^[0-9a-f]{40}$",
]

[[allowlists]]
description = "a lowercase snake_case key name beside the word discord — not a Discord client secret"
targetRules = ["discord-client-secret"]
regexes = [
  "^[a-z][a-z0-9]*(?:_[a-z0-9]+)+$",
]
