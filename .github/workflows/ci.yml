# Runs the repo's full check suite, bin/gate, on GitHub's runners instead of a laptop.
#
# Why this exists: every gate in this repo — signatures, instruction quality, lint, the unit
# suite — was once a LOCAL pre-push hook and nothing else. Two holes follow from
# that, and neither is fixable locally. A clone that never ran `bin/install-hook-shim`, or
# whose `core.hooksPath` drifted, has no gate at all. And commits arriving from a second
# machine are gated by whatever that machine happens to have installed — which is how 173
# of this repo's commits ended up unsigned.
#
# The `gate` job is the check main's `main CI gate` ruleset requires, so it blocks as well as
# reports: main cannot move onto a commit until this job has passed on it. Rename the job and
# the ruleset's required check (and bin/land's LAND_REQUIRED_CHECK default) together. `gate`
# runs nothing itself; it passes only when `suite`, `render`, `bootstrap`, `bootstrap-windows`
# and `bootstrap-macos` all passed, so a job added to its `needs:` blocks a landing without a ruleset edit.
#
# The gate is invoked as bin/gate rather than reimplemented step by step, so CI and a hand
# run cannot drift into checking different things. Since #694 the pre-push hook runs only the
# signature check and lint, and this job is where the suite runs. The signature check reads
# git's pre-push protocol from stdin, so it gets its own step below with an explicit range.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR branch, so a re-push does not leave an obsolete run burning minutes beside
# the one that supersedes it. A PR run's range is base..head, so the newer run is a superset
# of the one it replaces and nothing goes unchecked.
#
# A PUSH run is grouped by its own SHA, which means every push gets a group to itself and
# nothing is ever cancelled. That is deliberate and it is not the same as `cancel-in-progress:
# false`: the documented default is that a QUEUED run cancels any run already PENDING in its
# group, whatever cancel-in-progress says. A push run checks `event.before..sha`, so a
# cancelled push B leaves its commits inside no run's range at all — push C starts from B's
# head — and the signature check below, the hole this workflow exists to close, would never
# see them. A group per commit cannot do that.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # The required check. A job whose `needs:` failed is SKIPPED, and the ruleset counts a
  # skipped required check as passing, so this runs `always()` and reads each result itself.
  gate:
    needs: [suite, render, bootstrap, bootstrap-windows, bootstrap-macos]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "suite, render legs, bootstrap, bootstrap-windows, bootstrap-macos: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a job the gate requires ended $r"; exit 1; }
          done

  suite:
    # A named release image, not the rolling alias: this job relies on the image's preinstalled
    # shellcheck, and the alias moves to a new Ubuntu release with no commit here.
    runs-on: ubuntu-24.04
    steps:
      # Each action is pinned to the commit its tag pointed at, with the tag in the comment. A
      # tag is a mutable pointer — `@v4` is wherever the publisher last moved it — so a
      # tag-pinned action can change what this gate runs after the change was reviewed.
      # Renovate's github-actions manager reads the `# vX.Y.Z` comment natively.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The signature step walks a commit range and the gate's own steps read git
          # history; a shallow clone makes both wrong rather than failing loudly.
          fetch-depth: 0

      # Every version below comes from home/.chezmoidata/tools.toml, the same file the machine
      # installers render. Writing one here instead is how CI and a laptop ended up running
      # different builds of prek — the hook runner whose verdict decides whether a push is
      # clean. Runs first, because the setup actions consume its output. The awk reads the
      # [toolchain] table alone, so a `name = "..."` elsewhere in that file cannot be mistaken
      # for a pin.
      - name: Read the pinned toolchain
        run: |
          set -euo pipefail
          awk '
            /^\[toolchain\]$/ { in_table = 1; next }
            /^\[/             { in_table = 0 }
            in_table && /^[a-z_]+ = "/ {
              gsub(/"/, "", $3)
              print "TOOLCHAIN_" toupper($1) "=" $3
            }
          ' home/.chezmoidata/tools.toml | tee -a "$GITHUB_ENV"

      # Three-part versions. A two-part node or python request leaves the patch level to
      # resolve at run time, so two runs of one commit can use different interpreters.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.TOOLCHAIN_NODE }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.TOOLCHAIN_PYTHON }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # Without this the action installs whatever uv Astral released most recently, so the
          # SHA pin above would still deliver a floating binary.
          version: ${{ env.TOOLCHAIN_UV }}

      # The gate's `language: system` hooks need these on PATH. shellcheck is preinstalled
      # on the runner image; oxlint and prek are not, and chezmoi is what renders the .sh.tmpl
      # scripts for shellcheck-templates and the template tests.
      #
      # Installed explicitly rather than left to the hook's skip-if-absent branches, because
      # a skipped step is exactly the failure this workflow exists to close: the gate prints
      # "passed, 1 step skipped" and exits 0, which is a green that checked less than it
      # looks like. The assertion at the end of the gate step enforces that.
      - name: Install the gate's tools
        run: |
          set -euo pipefail
          npm install -g "oxlint@${TOOLCHAIN_OXLINT}"
          uv tool install "prek==${TOOLCHAIN_PREK}"
          # The claude-guard shims resolve their interpreter with
          # `uv python find --no-project --managed-python --system 3.15`, and
          # `--managed-python` excludes the hostedtoolcache build actions/setup-python
          # provides. Without a uv-MANAGED 3.15 the shims take their
          # interpreter-unavailable fallback, and their tests assert the live path.
          #
          # The exact version, not `3.15`, which resolved a patch level at run time. An exact
          # install still answers the shims' two-part request: uv creates the `cpython-3.15-*`
          # alias alongside `cpython-3.15.2-*`, and `find 3.15` matches it.
          uv python install "${TOOLCHAIN_PYTHON}"
          bin/ci-install-chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          shellcheck --version | head -2

      # Pin the machine profile, or the suite renders for a machine nobody has.
      #
      # Found by this workflow's first run: 111 tests failed on the runner against a tree
      # whose gate is green on both real hosts. `home/.chezmoi.toml.tmpl` asks for `profile`
      # and `work` through promptStringOnce/promptBoolOnce, and the answers live in
      # ~/.config/chezmoi/chezmoi.toml, which a runner does not have. Every host-conditional
      # template then renders against absent data, and the chezmoi-script tests assert
      # against a render their author never saw.
      #
      # workstation rather than server: it is the superset, so it exercises the most scripts.
      # A runner can only ever be one profile — the other two are covered by the machines
      # that actually are them, which is where this gate also runs.
      #
      # Written directly rather than through `chezmoi init`, which wants a source argument
      # and a TTY for the prompts. `execute-template` reads [data] and nothing else here. The
      # `bootstrap` job below is the one that runs `chezmoi init` and its prompts.
      - name: Pin the chezmoi profile
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/chezmoi"
          cat > "$HOME/.config/chezmoi/chezmoi.toml" <<'TOML'
          umask = 0o022
          [data]
              work = false
              profile = "workstation"
          [interpreters.sh]
              command = "bash"
          TOML
          chezmoi execute-template --source home '{{ .profile }} {{ .chezmoi.os }}'
          echo

      - name: Run the gate
        env:
          # tq digests output for a human reading a terminal. CI wants the failing test's
          # own lines, so take the raw runner output.
          TQ_OFF: '1'
        run: |
          set -euo pipefail
          bin/gate 2>&1 | tee gate.log

          # A gate that skipped a step passed less than it says. Locally that is a
          # deliberate kindness to a machine missing a tool; in CI every tool is installed
          # above, so a skip means the install broke and the green is misleading.
          if grep -q 'step.* skipped' gate.log; then
            echo "::error::the gate skipped a step — a tool above failed to install"
            exit 1
          fi

      # Signatures. Every other step reads the working tree; this one reads a commit RANGE,
      # so it has to be told which.
      #
      # `--range`, not a hand-built protocol line on stdin. The first version did the
      # latter, and it checked ZERO commits while exiting 0 and printing nothing: the hook
      # path appends `--not --remotes` so a server-side rebase replay is not re-judged, and
      # actions/checkout has already created a remote-tracking ref for the branch under
      # test, which excluded every commit. `--range` uses a plain two-dot range and refuses
      # an empty one, so this step cannot pass by having done nothing.
      #
      # The allowed_signers line is load-bearing, not a formality. Commits here are
      # SSH-signed, and with gpg.ssh.allowedSignersFile UNSET git will not read an SSH
      # signature at all: it reports %G? = N — the same code a genuinely unsigned commit
      # gets — and explains itself only on stderr. This step's first run on main therefore
      # failed with "10 of 10 pushed commit(s) are not properly signed" against ten commits
      # that are signed and read G locally.
      #
      # An EMPTY file is enough. The signature is then read but cannot be attributed to a
      # key, so it downgrades to U (unverified) and only warns — which is the intended
      # behaviour: the hole being closed is UNSIGNED commits, and catching those needs no
      # trust material. Listing real public keys would be the stricter version and is not a
      # runner's job.
      #
      # `gpg.format` is deliberately not set: git dispatches on the signature's own armor
      # header, so an SSH signature verifies as one whatever the configured default is.
      #
      # The gate now exits 3 rather than rejecting when this is absent, so a future runner
      # that drops these two lines fails loudly instead of blocking every push for a reason
      # that is not true.
      #
      # Do not set SIGN_GATE_STRICT here: it would turn every U into a failure, for want of
      # a keyring the runner has no way to have.
      - name: Check commit signatures
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/allowed_signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          # All-zeroes is a branch's first push, where there is no base to diff against.
          # Fall back to the merge-base with the default branch rather than to the root
          # commit, which would re-judge history from before this gate existed.
          case "$base" in
            *[!0]*) ;;
            *) base=$(git merge-base origin/main "$head") ;;
          esac
          bin/check-push-signatures --range "$base" "$head"

  # The suite runs on Linux, and a template branch for darwin or windows that fails to render
  # would otherwise surface on the next `chezmoi apply` on that machine. This job renders the
  # whole source tree on the other two systems, under each answer to the `work` prompt, since
  # the work laptop is a Mac. It does not run the suite there, and `gate` waits on it.
  #
  # Named release images rather than the rolling `-latest` aliases, for the same reason the suite
  # names ubuntu-24.04: an alias moves with no commit here.
  #
  # `chezmoi init` writes the config from home/.chezmoi.toml.tmpl, which is itself one of the
  # templates with a Windows branch (the Git Bash interpreter path). A hand-written config
  # would skip it, and would carry no [interpreters.sh] for the modify_ script to run under.
  # chezmoi keys --promptBool by the PROMPT TEXT, not the data key, so the data check after
  # init fails the job if a reworded prompt fell back to its default.
  #
  # `apply --dry-run` renders every target, the run_ scripts included, and writes and executes
  # nothing except the modify_ scripts, which chezmoi runs to compute their targets. The
  # destination, cache and state are scratch paths, so the runner's own HOME stays untouched.
  # Externals are excluded because they are downloads, not templates; chezmoi still renders
  # .chezmoiexternal when it reads the source state.
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        work: [false, true]
    name: render (${{ matrix.os }}, work=${{ matrix.work }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install chezmoi
        run: |
          bin/ci-install-chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render every template
        env:
          WORK: ${{ matrix.work }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/render"
          mkdir -p "$scratch/home"
          cm() {
            chezmoi --config "$scratch/chezmoi.toml" --source "$GITHUB_WORKSPACE" \
              --cache "$scratch/cache" --persistent-state "$scratch/state.boltdb" "$@"
          }
          cm init --no-tty --promptDefaults --promptBool "Is this a work machine=$WORK"
          data="$(cm execute-template '{{ .chezmoi.os }} work={{ .work }} profile={{ .profile }}')"
          echo "$data"
          case "$data" in
            *"work=$WORK profile=workstation") ;;
            *) echo "::error::init wrote the wrong answers: $data"; exit 1 ;;
          esac
          cm --destination "$scratch/home" apply --dry-run --exclude=externals --no-tty

  # Bootstraps a machine from nothing, the path docs/RESTORE.md exists for. The suite writes
  # its chezmoi config by hand, so neither the prompts in home/.chezmoi.toml.tmpl nor the
  # run_once_ install scripts ever run there.
  #
  # A clean Ubuntu container and a non-root user with passwordless sudo, which is what a fresh
  # server gives the operator: the install scripts call `sudo apt-get` and `sudo chsh`, and a
  # bare root container has no sudo. `server` is the profile daniel-box runs on Ubuntu.
  #
  # `init --apply` clones a copy of the PR head, not GitHub's main, so the run judges this
  # change. It runs under `script` because set-default-shell defers with a non-zero exit when
  # stdin is not a terminal. That is the right answer for a headless re-apply and the wrong one
  # for a first apply. `work` and `agent` take their defaults (false). The data check after the
  # apply fails the job if a reworded prompt let `profile` fall back to its default.
  bootstrap:
    name: bootstrap (ubuntu:24.04, profile=server)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - name: Install what a fresh Ubuntu host has
        run: |
          set -eu
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl git sudo
          useradd --create-home --shell /bin/bash dev
          echo 'dev ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/dev

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: chezmoi init --apply
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /home/dev/checkout
          chown -R dev:dev /home/dev/checkout
          cat > /home/dev/bootstrap.sh <<'SH'
          set -eu
          cd "$HOME"
          checkout/bin/ci-install-chezmoi "$HOME/.local/bin"
          "$HOME/.local/bin/chezmoi" init --apply --no-tty --promptDefaults \
            --promptString 'Machine profile (workstation/server/minimal)=server' \
            "$HOME/checkout"
          data="$("$HOME/.local/bin/chezmoi" execute-template 'work={{ .work }} profile={{ .profile }} agent={{ .agent }}')"
          echo "$data"
          [ "$data" = 'work=false profile=server agent=false' ] || { echo "init wrote the wrong answers: $data" >&2; exit 1; }
          SH
          chown dev:dev /home/dev/bootstrap.sh
          su - dev -c 'script -qec "bash \"\$HOME/bootstrap.sh\"" /dev/null'

  # The Windows half of `bootstrap`: home/dot_config/windows-provisioning/WINDOWS-SETUP.md's
  # `chezmoi init --apply` from PowerShell, so the os-windows run_ scripts execute rather than
  # only render. `server` keeps the job within a hosted runner's reach: it skips the winget GUI
  # inventory and the system-wide font, both workstation-only, and still runs the CLI toolchain,
  # Claude Code, the PATH tweaks and the Git Bash scripts.
  #
  # The runner is not a bare machine. It ships git, node, python and pwsh, so install-cli-tools
  # skips whatever is already on PATH. winget is checked first because winget-install.ps1 warns
  # and returns without it, which would let the apply pass having installed nothing; the checks
  # after the apply name things only the run_ scripts put there.
  bootstrap-windows:
    name: bootstrap (windows-2025, profile=server)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Require winget
        shell: pwsh
        run: winget --version

      - name: Install chezmoi
        shell: bash
        run: |
          bin/ci-install-chezmoi
          cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Windows PowerShell 5.1, as on a fresh PC where pwsh is not installed yet. The re-apply
      # step below covers an operator who starts chezmoi from pwsh instead.
      - name: chezmoi init --apply
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          chezmoi init --apply --no-tty --promptDefaults `
            --promptString 'Machine profile (workstation/server/minimal)=server' `
            $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "chezmoi init --apply exited $LASTEXITCODE" }
          $data = chezmoi execute-template 'work={{ .work }} profile={{ .profile }} agent={{ .agent }}'
          Write-Host $data
          if ($data -ne 'work=false profile=server agent=false') { throw "init wrote the wrong answers: $data" }

      # chezmoi started from pwsh hands each .ps1 script's powershell.exe pwsh's PSModulePath,
      # which 5.1 cannot load built-in modules from. The [scriptEnv] PSModulePath in
      # .chezmoi.toml.tmpl overrides it. Clearing the script state makes install-claude run
      # again, and deleting claude.exe gets it past its skip-if-present check to the installer,
      # which calls Get-FileHash. The check step below then requires claude.exe back.
      - name: chezmoi apply from pwsh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item "$HOME\.local\bin\claude.exe"
          chezmoi state delete-bucket --bucket=scriptState
          if ($LASTEXITCODE -ne 0) { throw "chezmoi state delete-bucket exited $LASTEXITCODE" }
          chezmoi apply --no-tty
          if ($LASTEXITCODE -ne 0) { throw "chezmoi apply from pwsh exited $LASTEXITCODE" }

      - name: Check what the run_ scripts installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          winget list --exact --id Starship.Starship --accept-source-agreements | Out-Null
          if ($LASTEXITCODE -ne 0) { $missing += 'Starship.Starship (install-cli-tools)' }
          if (-not (Test-Path "$HOME\.local\bin\claude.exe")) { $missing += 'claude.exe (install-claude)' }
          if (-not (Test-Path "$env:APPDATA\fnm\aliases\default")) { $missing += 'a default Node under fnm (install-cli-tools)' }
          if (-not (Test-Path "$HOME\.local\bin\ruff.exe")) { $missing += 'ruff.exe via uv tool (install-cli-tools)' }
          if (-not (Test-Path "$HOME\.local\share\blesh\ble.sh")) { $missing += 'ble.sh (install-blesh)' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
          if ($userPath -notcontains "$env:USERPROFILE\.local\bin") { $missing += '~\.local\bin on the User PATH (setup-windows-tweaks)' }
          if ($missing) { throw "bootstrap left these missing: $($missing -join ', ')" }

  # The macOS half of `bootstrap`, so the os-darwin and os-unix run_ scripts execute rather than
  # only render. `render` covers macOS with `apply --dry-run`, which runs no run_ script. `server`
  # keeps the job within a hosted runner's reach, as it does for bootstrap-windows: Brewfile.tmpl
  # gates its casks, `mas` and `vscode` rows on workstation except 1Password, which commit signing
  # needs, so brew bundle installs the CLI toolchain and nothing that needs an App Store sign-in.
  #
  # The runner is not a bare Mac. It ships Homebrew, node, python and gh. Homebrew is checked
  # first because install-brew-bundle defers without it, which would fail the apply for a
  # reason a real Mac also has. The checks after the apply name things only the run_ scripts
  # put there. The apply runs under BSD script(1), whose argument order differs from the
  # util-linux one the Ubuntu job uses, for the same reason: set-default-shell defers without a
  # terminal. script(1) does not reliably pass the child's exit status through, so the script
  # writes its own status to a file and the step reads that.
  bootstrap-macos:
    name: bootstrap (macos-15, profile=server)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Require Homebrew
        run: brew --version

      - name: Install chezmoi
        run: |
          bin/ci-install-chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: chezmoi init --apply
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/bootstrap.status"
          cat > "$RUNNER_TEMP/bootstrap.sh" <<SH
          chezmoi init --apply --no-tty --promptDefaults \\
            --promptString 'Machine profile (workstation/server/minimal)=server' \\
            "$GITHUB_WORKSPACE"
          echo \$? > "$status"
          SH
          script -q /dev/null bash "$RUNNER_TEMP/bootstrap.sh"
          [ "$(cat "$status")" = 0 ] || { echo "::error::chezmoi init --apply exited $(cat "$status")"; exit 1; }
          data="$(chezmoi execute-template 'work={{ .work }} profile={{ .profile }} agent={{ .agent }}')"
          echo "$data"
          [ "$data" = 'work=false profile=server agent=false' ] || { echo "::error::init wrote the wrong answers: $data"; exit 1; }

      - name: Check what the run_ scripts installed
        run: |
          set -euo pipefail
          missing=''
          brew list --formula util-linux >/dev/null 2>&1 || missing="$missing util-linux(install-brew-bundle)"
          [ -x "$HOME/.local/bin/claude" ] || missing="$missing claude(install-claude)"
          [ -x "$HOME/.local/bin/ruff" ] || missing="$missing ruff-via-uv-tool(install-python-tools)"
          [ -e "$HOME/.local/share/fnm/aliases/default" ] || missing="$missing fnm-default-node(install-brew-bundle)"
          [ -d /Applications/1Password.app ] || missing="$missing 1Password.app(install-brew-bundle)"
          login_shell="$(dscl . -read "/Users/$(id -un)" UserShell | awk '{print $2}')"
          [ "$login_shell" = /bin/zsh ] || missing="$missing zsh-login-shell(set-default-shell,got:$login_shell)"
          [ -z "$missing" ] || { echo "::error::bootstrap left these missing:$missing"; exit 1; }
