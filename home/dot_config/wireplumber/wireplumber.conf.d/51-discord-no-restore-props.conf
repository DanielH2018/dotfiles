# Stop WirePlumber persisting volume/mute for Discord's voice playback stream.
#
# Discord plays through two nodes that share application.name "WEBRTC VoiceEngine":
# the Stream/Output/Audio node carries other people's voices, the Stream/Input/Audio
# node is the mic. Only the playback node is matched here, so mic gain still persists
# normally.
#
# Background: a per-app mute on the playback node is saved to
# ~/.local/state/wireplumber/stream-properties keyed by application name, and
# re-applied at every Discord launch. That makes an accidental mute look permanent —
# every other Discord sound keeps working, so it presents as "my friend's mic is
# broken" rather than as a local mute. Disabling restore for this one stream means it
# always starts at default volume, unmuted.
#
# state.restore-props gates both the restore path and the save path in
# /usr/share/wireplumber/scripts/node/state-stream.lua (lines 58 and 154). The value
# is compared as a string against "false", hence the quoting.
#
# Trade-off: setting Discord's voice volume in the KDE mixer no longer persists across
# restarts. Discord's own per-user volume sliders are unaffected — those live inside
# Discord, not PipeWire.
#
# To revert: delete this file, `chezmoi apply`, `systemctl --user restart wireplumber`.

stream.rules = [
  {
    matches = [
      {
        application.name = "WEBRTC VoiceEngine"
        media.class = "Stream/Output/Audio"
      }
    ]
    actions = {
      update-props = {
        state.restore-props = "false"
      }
    }
  }
]
